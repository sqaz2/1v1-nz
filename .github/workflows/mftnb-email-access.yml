name: MFTNB email access check (read only)

on:
  push:
    branches: [codex/mftnb-email-access]
    paths: [.github/workflows/mftnb-email-access.yml]
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect only mftnb.com email setup using saved access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request

          class NoRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, url):
                  return None

          opener = urllib.request.build_opener(NoRedirects())
          report = ['# MFTNB email access check', '', 'GET requests only. No DNS, account, Worker, routing, billing or email changes.']

          def get(token, path, query=None):
              url = 'https://api.cloudflare.com/client/v4' + path
              if query:
                  url += '?' + urllib.parse.urlencode(query)
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}, method='GET')
              try:
                  with opener.open(request, timeout=10) as response:
                      raw = response.read(1_000_001)
                      status = response.status
              except urllib.error.HTTPError as error:
                  return None, 'HTTP ' + str(error.code)
              except (OSError, ValueError):
                  return None, 'network error'
              if len(raw) > 1_000_000:
                  return None, 'response too large'
              try:
                  payload = json.loads(raw)
              except (ValueError, UnicodeError):
                  return None, 'invalid JSON'
              if not isinstance(payload, dict) or payload.get('success') is not True:
                  return None, 'API did not confirm success (HTTP ' + str(status) + ')'
              return payload, None

          available = False
          for key in ('CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_DNS_API_TOKEN'):
              token = os.environ.get(key, '').strip()
              report += ['', '## ' + key]
              if not token:
                  report.append('Saved credential: missing.')
                  continue
              available = True
              report.append('Saved credential: present; never printed or exported.')
              payload, error = get(token, '/zones', {'name': 'mftnb.com', 'per_page': 50})
              if error:
                  report.append('mftnb.com zone: ' + error)
                  continue
              matches = [item for item in payload.get('result', []) if item.get('name') == 'mftnb.com']
              if len(matches) != 1:
                  report.append('mftnb.com zone: not uniquely accessible.')
                  continue
              zone = matches[0]
              zone_id = zone.get('id', '')
              account_id = zone.get('account', {}).get('id', '')
              if not re.fullmatch('[a-f0-9]{32}', zone_id) or not re.fullmatch('[a-f0-9]{32}', account_id):
                  report.append('Unexpected zone identifiers; stopped.')
                  continue
              report.append('mftnb.com zone ID: ' + zone_id)
              report.append('Cloudflare account ID: ' + account_id)
              for suffix in ('email/routing', 'email/routing/dns', 'email/routing/rules'):
                  payload, error = get(token, '/zones/' + zone_id + '/' + suffix)
                  if error:
                      report.append(suffix + ': ' + error)
                      continue
                  result = payload.get('result')
                  if suffix == 'email/routing' and isinstance(result, dict):
                      report.append(suffix + ': readable; enabled=' + str(result.get('enabled')) + '; status=' + str(result.get('status')))
                  elif suffix == 'email/routing/rules' and isinstance(result, list):
                      matching = [rule for rule in result if any(m.get('field') == 'to' and m.get('value', '').lower() == 'noreply@mftnb.com' for m in rule.get('matchers', []))]
                      report.append(suffix + ': readable; noreply rule count=' + str(len(matching)))
                  else:
                      report.append(suffix + ': readable.')
              for hostname, kind in (('mftnb.com', 'MX'), ('mftnb.com', 'TXT'), ('cf-bounce.mftnb.com', 'MX'), ('cf-bounce._domainkey.mftnb.com', 'TXT'), ('_dmarc.mftnb.com', 'TXT')):
                  payload, error = get(token, '/zones/' + zone_id + '/dns_records', {'name': hostname, 'type': kind, 'per_page': 100})
                  if error:
                      report.append(hostname + ' ' + kind + ': ' + error)
                  else:
                      report.append(hostname + ' ' + kind + ': readable; count=' + str(len(payload.get('result', []))))

          report += ['', 'Read access does not prove edit or Email Sending permissions. No emails were sent.']
          summary = '\n'.join(report) + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write(summary)
          if not available:
              raise SystemExit(1)
          PY
