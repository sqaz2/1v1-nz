<style>
  :root {
    --bg0: #050d1a; --bg1: #0a1c36; --card: #0c1f3d; --card2: #0f2749;
    --ink: #e9f2ff; --muted: #8fa6cc; --faint: #5c7299;
    --water: #0e2a52; --water2: #133c74; --line: #1d4c8c;
    --accent: #38bdf8; --accent-ink: #04263a;
    --ship: #4d7cb8; --hit: #ff7a45; --sunk: #a11d26; --miss: #9db4d8;
    --gold: #ffbf2f; --red: #f04455; --green: #34d399;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); min-height: 100vh; min-height: 100dvh;
    background:
      radial-gradient(1200px 500px at 50% -120px, #12335f 0%, transparent 60%),
      radial-gradient(900px 600px at 90% 110%, #0d2b55 0%, transparent 55%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 18px 14px 60px; }
  header.top { text-align: center; margin-bottom: 14px; }
  header.top .hero {
    display: block; width: min(100%, 520px); height: auto; margin: 0 auto 10px;
    border-radius: 14px; border: 1px solid var(--line);
    box-shadow: 0 10px 28px rgba(0,0,0,.35); object-fit: cover; max-height: 140px;
  }
  header.top h1 { margin: 0; font-size: 30px; letter-spacing: .5px; }
  header.top .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }

  .tabs { display: flex; gap: 8px; margin: 0 0 16px; }
  .tab {
    flex: 1; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--card); color: var(--muted); font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .status {
    text-align: center; font-weight: 700; font-size: 16px; min-height: 24px; margin: 10px 0;
  }
  .status .turn-you { color: var(--green); }
  .status .turn-them { color: var(--gold); }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--red); font-size: 13px; min-height: 18px; margin: 8px 0; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .row.between { justify-content: space-between; }
  .row.end { justify-content: flex-end; }
  .row.center { justify-content: center; }

  .btn {
    border: 1px solid var(--line); background: var(--card2); color: var(--ink);
    padding: 11px 16px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .linklike {
    border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 700;
    cursor: pointer; padding: 6px 8px; border-radius: 8px;
  }
  .linklike:hover { background: rgba(255,255,255,.07); color: var(--ink); }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .segbtn {
    border: 0; background: transparent; color: var(--muted); padding: 10px 18px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .segbtn.active { background: var(--accent); color: var(--accent-ink); }

  .field { display: block; margin: 8px 0; font-size: 13px; color: var(--muted); font-weight: 700; }
  .field input, #onlineForm input {
    display: block; width: 100%; margin-top: 6px; padding: 12px;
    border: 1px solid var(--line); border-radius: 12px; background: #081830; color: var(--ink); font-size: 16px;
  }
  #onlineForm { display: flex; gap: 10px; align-items: stretch; }
  #onlineForm input { margin-top: 0; text-transform: uppercase; letter-spacing: 2px; max-width: 170px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin: 12px 0;
  }
  .big-code {
    font-size: 34px; font-weight: 800; letter-spacing: 8px; text-align: center; margin: 10px 0;
    color: var(--accent);
  }

  .battle { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  @media (min-width: 920px) { .battle { flex-direction: row; align-items: flex-start; justify-content: center; } }
  .board-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; width: 100%; max-width: 460px;
  }
  .board-card h2 { margin: 0 0 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
  .hint { color: var(--faint); font-size: 12px; margin: 8px 0 0; text-align: center; }

  .bgrid {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; width: 100%;
    position: relative;
    background-color: var(--water);
    background-image: url("assets/water-tile.png");
    background-size: 40% auto;
    background-repeat: repeat;
    border-radius: 6px;
    padding: 2px;
  }
  .bcell {
    aspect-ratio: 1; border-radius: 4px; border: 1px solid rgba(29,76,140,.32);
    background: rgba(14,42,82,.2);
    padding: 0; cursor: pointer; position: relative; min-width: 0; z-index: 1;
  }
  .bcell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .bgrid.aim .bcell:hover { background: rgba(19,60,116,.55); }
  /* Ship cells are transparent so spanning sprites show through; hits tint on top. */
  .bcell.ship,
  .bcell.shiphit,
  .bcell.shipsunk { border-color: transparent; }
  .bcell.ship { background: transparent; }
  .bcell.shiphit {
    background: rgba(255,122,69,.52);
    background-image: url("assets/fx-explosion.png");
    background-size: 90% 90%; background-repeat: no-repeat; background-position: center;
    z-index: 3;
  }
  .bcell.shipsunk {
    background: rgba(161,29,38,.58);
    background-image: url("assets/fx-explosion.png");
    background-size: 85% 85%; background-repeat: no-repeat; background-position: center;
    filter: saturate(.85);
    z-index: 3;
  }
  .bcell.miss::after {
    content: ""; position: absolute; inset: 18%; border-radius: 50%;
    background: url("assets/fx-splash.png") center/contain no-repeat;
    opacity: .95; pointer-events: none;
  }
  .bcell.hit {
    background: rgba(255,122,69,.75); border-color: #ffb08a;
    background-image: url("assets/fx-explosion.png");
    background-size: 90% 90%; background-repeat: no-repeat; background-position: center;
    z-index: 3;
  }
  .bcell.sunk {
    background: rgba(161,29,38,.8); border-color: #e06a72;
    background-image: url("assets/fx-explosion.png");
    background-size: 85% 85%; background-repeat: no-repeat; background-position: center;
    z-index: 3;
  }
  .bcell.last { box-shadow: 0 0 0 2px var(--gold), 0 0 12px var(--gold); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 2px var(--gold), 0 0 4px var(--gold); } }

  /* Ship sprites pinned to measured cell boxes (not CSS grid spans — gap/padding drift).
     Art faces right; .vert rotates 90deg CW → bow down. Hit/sunk cells keep z-index 3 above hulls. */
  .ship-sprite {
    pointer-events: none;
    z-index: 2;
    position: absolute;
    left: 0; top: 0;
    display: block;
    overflow: hidden;
    box-sizing: border-box;
    margin: 0; padding: 0;
  }
  .ship-sprite img {
    display: block;
    pointer-events: none;
    object-fit: contain;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,.7)) drop-shadow(0 1px 2px rgba(0,0,0,.45));
  }
  .ship-sprite.horiz img {
    width: 100%;
    height: 88%;
    margin: 6% 0 0;
  }
  .ship-sprite.vert img {
    position: absolute;
    top: 50%;
    left: 50%;
    /* Pre-rotate: width = box height, height ≈ box width so 90deg CW fills the tall cell span. */
    width: var(--box-h, 100%);
    height: calc(var(--box-w, 100%) * 0.88);
    max-width: none;
    transform: translate(-50%, -50%) rotate(90deg);
    object-fit: contain;
  }
  .ship-sprite.sunk img {
    filter: drop-shadow(0 2px 5px rgba(0,0,0,.85)) grayscale(.55) brightness(.48) contrast(1.15);
  }
  .ship-sprite.hit:not(.sunk) img { filter: drop-shadow(0 2px 5px rgba(0,0,0,.7)) saturate(1.1); }
  /* Crack lines + soft smoke over sunk hull (own board sprites). */
  .ship-sprite.sunk::before {
    content: ""; position: absolute; inset: 8% 6%; z-index: 2; pointer-events: none;
    background:
      linear-gradient(118deg, transparent 46%, rgba(0,0,0,.75) 48%, rgba(40,10,10,.9) 50%, transparent 52%),
      linear-gradient(28deg, transparent 42%, rgba(0,0,0,.55) 49%, rgba(255,180,120,.35) 50%, transparent 58%),
      linear-gradient(-12deg, transparent 55%, rgba(0,0,0,.65) 57%, transparent 60%);
    mix-blend-mode: multiply; opacity: .9;
  }
  .ship-sprite.sunk .wreck-smoke {
    position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: visible;
  }
  .ship-sprite.sunk .wreck-smoke i {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle, rgba(180,190,200,.55) 0%, rgba(90,100,110,.25) 45%, transparent 70%);
    left: var(--sx, 50%); bottom: var(--sy, 35%);
    animation: wreck-smoke-rise var(--dur, 2.4s) ease-out infinite;
    animation-delay: var(--delay, 0s);
    opacity: 0; filter: blur(1px);
  }
  @keyframes wreck-smoke-rise {
    0%   { transform: translate(-50%, 0) scale(.55); opacity: 0; }
    12%  { opacity: .55; }
    55%  { opacity: .35; }
    100% { transform: translate(calc(-50% + var(--drift, 6px)), -28px) scale(1.35); opacity: 0; }
  }
  /* Enemy / cell sunk: keep explosion, add light smoke wisps (phone-readable). */
  .bcell.sunk::before,
  .bcell.shipsunk::before {
    content: ""; position: absolute; left: 50%; bottom: 42%; width: 7px; height: 7px;
    margin-left: -3.5px; border-radius: 50%; pointer-events: none; z-index: 4;
    background: radial-gradient(circle, rgba(200,210,220,.5) 0%, transparent 70%);
    animation: cell-smoke 2.1s ease-out infinite;
    filter: blur(.6px);
  }
  .bcell.sunk::after {
    content: ""; position: absolute; left: 12%; right: 12%; top: 48%; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,220,180,.85), transparent);
    transform: rotate(-18deg); box-shadow: 0 3px 0 rgba(0,0,0,.45);
    pointer-events: none; z-index: 4;
  }
  .bcell.shipsunk::after {
    content: ""; position: absolute; left: 18%; right: 22%; top: 52%; height: 1.5px;
    background: rgba(255,200,160,.55); transform: rotate(14deg);
    pointer-events: none; z-index: 4;
  }
  @keyframes cell-smoke {
    0%   { transform: translateY(0) scale(.6); opacity: 0; }
    20%  { opacity: .5; }
    100% { transform: translateY(-11px) scale(1.4); opacity: 0; }
  }
  /* Torpedo travel projectile (transform — reliable on phones) */
  .torpedo-flight {
    position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
    border-radius: 50% 50% 40% 40%;
    background: linear-gradient(180deg, #f0f9ff 0%, #7dd3fc 42%, #0369a1 100%);
    box-shadow: 0 0 5px 1px rgba(56,189,248,.7), -8px 0 7px -2px rgba(125,211,252,.4);
    z-index: 20; pointer-events: none; left: 0; top: 0;
    will-change: transform;
    animation: torpedo-fly var(--tms, 560ms) cubic-bezier(.35,.05,.55,1) forwards;
  }
  .torpedo-flight::after {
    content: ""; position: absolute; right: 65%; top: 50%; width: 14px; height: 2px;
    transform: translateY(-50%);
    background: linear-gradient(90deg, transparent, rgba(186,230,253,.65));
    border-radius: 2px; filter: blur(.4px);
  }
  @keyframes torpedo-fly {
    from { transform: translate(0, 0) rotate(var(--rot, 0deg)) scale(.85); opacity: .9; }
    to   { transform: translate(var(--dx), var(--dy)) rotate(var(--rot, 0deg)) scale(1); opacity: 1; }
  }
  .ship-sprite.sunk { overflow: visible; }
  @media (prefers-reduced-motion: reduce) {
    .ship-sprite.sunk .wreck-smoke i,
    .bcell.sunk::before,
    .bcell.shipsunk::before { animation: none; opacity: .35; }
    .torpedo-flight { animation-duration: 1ms !important; }
  }
  .ship-sprite.ghost { z-index: 2; }
  .ship-sprite.ghost.valid { opacity: .55; }
  .ship-sprite.ghost.valid img {
    filter: drop-shadow(0 0 2px rgba(70,220,200,.95)) drop-shadow(0 0 6px rgba(50,200,160,.55)) drop-shadow(0 2px 4px rgba(0,0,0,.35));
  }
  .ship-sprite.ghost.invalid { opacity: .4; }
  .ship-sprite.ghost.invalid img {
    filter: drop-shadow(0 0 2px rgba(255,90,90,.95)) drop-shadow(0 0 6px rgba(220,50,50,.45)) sepia(.35) hue-rotate(-15deg) saturate(1.6);
  }
  @keyframes ship-place {
    from { transform: scale(.92); opacity: .45; }
    to { transform: scale(1); opacity: 1; }
  }
  .ship-sprite.just-placed { animation: ship-place 180ms ease-out; }

  /* placement */
  .place-ui .palette { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .shipbtn {
    border: 1px solid var(--line); background: var(--card2); color: var(--ink);
    border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 700; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px;
  }
  .shipbtn .ship-thumb {
    height: 22px; width: auto; max-width: 78px; object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); pointer-events: none;
  }
  .shipbtn .shipbtn-meta { display: flex; align-items: baseline; gap: 0; flex-wrap: wrap; justify-content: center; }
  .shipbtn .pips { color: var(--accent); letter-spacing: 1px; margin-left: 6px; }
  .shipbtn.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .shipbtn.placed { opacity: .4; cursor: default; }
  .place-grid .bcell { cursor: crosshair; border-color: rgba(29,76,140,.26); }
  .place-grid .bcell.invalid {
    border-color: #e06a72 !important;
    background: rgba(161,29,38,.48) !important;
  }
  .place-hint { color: var(--muted); font-size: 13px; margin: 8px 0; min-height: 18px; }
  .ready { width: 100%; margin-top: 10px; }
  .ready.ready-pulse {
    animation: ready-glow 1.6s ease-in-out infinite;
    box-shadow: 0 0 0 2px rgba(80,200,180,.4), 0 0 14px rgba(80,200,180,.32);
  }
  @keyframes ready-glow {
    50% { box-shadow: 0 0 0 3px rgba(80,200,180,.6), 0 0 22px rgba(80,200,180,.48); }
  }
  .place-wait { text-align: center; color: var(--gold); font-weight: 700; margin: 12px 0; }

  /* lobby */
  #sessionList { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
  #sessionListWrap h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin: 18px 0 4px; }
  .session-entry {
    display: flex; gap: 8px; align-items: stretch; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 6px;
  }
  .session-entry.has-attention { border-color: var(--green); }
  .session-open {
    flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: transparent; border: 0; color: var(--ink); text-align: left; cursor: pointer; padding: 8px;
  }
  .session-title { display: flex; flex-direction: column; gap: 2px; }
  .session-name { font-size: 15px; }
  .session-code { font-size: 12px; color: var(--faint); letter-spacing: 2px; }
  .session-meta { display: flex; gap: 8px; align-items: center; }
  .session-badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #16345f; color: var(--muted); }
  .session-badge.yours { background: rgba(52,211,153,.16); color: var(--green); }
  .session-badge.theirs { background: rgba(255,191,47,.14); color: var(--gold); }
  .session-badge.warn { background: rgba(240,68,85,.16); color: var(--red); }
  .session-series { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
  .session-leave { border: 0; background: transparent; color: var(--faint); font-size: 17px; padding: 8px 12px; cursor: pointer; }
  .session-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; }
  .lobby-empty { color: var(--faint); font-size: 13px; }

  .ghead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .ghead strong { font-size: 16px; }
  .recovery {
    display: flex; gap: 10px; align-items: center; background: rgba(255,191,47,.1);
    border: 1px solid var(--gold); border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size: 13px;
  }
  .result { font-size: 24px; font-weight: 800; text-align: center; margin: 8px 0; }

  .errbanner {
    position: fixed; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top));
    max-width: min(92vw, 480px); background: #3a1420; border: 1px solid var(--red); color: #ffd9de;
    padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 60;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .errbanner.show { opacity: 1; }

  .overlay {
    position: fixed; inset: 0; background: rgba(3,8,18,.72); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .overlay[hidden] { display: none; }
  .dialog {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px; width: 100%; max-width: 380px; box-shadow: 0 18px 60px rgba(0,0,0,.55);
  }
  .dialog p { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
</style>

<body>
<main class="wrap">
  <header class="top">
    <img class="hero" src="assets/hero.jpg" alt="" width="640" height="360">
    <h1>⚓ Battleship</h1>
    <p class="sub"><a href="https://1v1.nz/" style="color:inherit;text-decoration:none">1v1.nz</a></p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Game mode">
    <button type="button" id="tabCpu" class="tab active" role="tab" aria-selected="true">Vs computer</button>
    <button type="button" id="tabOnline" class="tab" role="tab" aria-selected="false">Online</button>
  </nav>

  <!-- ============ VS COMPUTER ============ -->
  <section id="cpuPanel" aria-label="Vs computer">
    <div class="row between">

<script>
(() => {
      'use strict';

      // ---------- DOM ----------
      const $ = id => document.getElementById(id);
      const tabCpu = $('tabCpu'), tabOnline = $('tabOnline');
      const cpuPanel = $('cpuPanel'), onlinePanel = $('onlinePanel');
      const diffRow = $('diffRow'), diffButtons = [...diffRow.querySelectorAll('.segbtn')];
      const cpuStatus = $('cpuStatus'), cpuPlace = $('cpuPlace'), cpuBattle = $('cpuBattle');
      const cpuEnemyGrid = $('cpuEnemyGrid'), cpuOwnGrid = $('cpuOwnGrid');
      const cpuNew = $('cpuNew'), cpuResign = $('cpuResign');
      const cpuSeriesLabel = $('cpuSeries'), cpuSeriesReset = $('cpuSeriesReset');
      const gameOverlay = $('gameOverlay'), cpuResultText = $('cpuResultText');
      const cpuSeriesText = $('cpuSeriesText'), cpuPlayAgain = $('cpuPlayAgain');
      const displayName = $('displayName'), createGame = $('createGame'), findMatch = $('findMatch');
      const onlineForm = $('onlineForm'), joinCode = $('joinCode'), joinGame = $('joinGame');
      const onlineError = $('onlineError'), onlineSetup = $('onlineSetup');
      const matchSearch = $('matchSearch'), matchSearchText = $('matchSearchText'), cancelMatch = $('cancelMatch');
      const matchStats = $('matchStats'), sessionList = $('sessionList'), lobbyNote = $('lobbyNote');
      const sessionListWrap = $('sessionListWrap'), gameView = $('gameView');
      const backToLobby = $('backToLobby'), ghOpponent = $('ghOpponent'), ghSeries = $('ghSeries');
      const connectionRecovery = $('connectionRecovery'), connectionIndicator = $('connectionIndicator');
      const retryGameConnection = $('retryGameConnection'), takeoverButton = $('takeoverButton');
      const onlineStatus = $('onlineStatus'), waitingCard = $('waitingCard');
      const lobbyStatus = $('lobbyStatus'), inviteCode = $('inviteCode'), lobbyError = $('lobbyError');
      const shareInvite = $('shareInvite'), copyGameLink = $('copyGameLink');
      const retryLobbyConnection = $('retryLobbyConnection'), leaveOnline = $('leaveOnline');
      const onlinePlace = $('onlinePlace'), onlineBattle = $('onlineBattle');
      const enemyGrid = $('enemyGrid'), ownGrid = $('ownGrid');
      const resignButton = $('resignButton'), shareBtn = $('shareBtn'), leaveGameButton = $('leaveGameButton');
      const onlineGameActions = $('onlineGameActions'), resultText = $('resultText');
      const seriesText = $('seriesText'), rematch = $('rematch'), newOnlineGame = $('newOnlineGame');
      const errBanner = $('errBanner');
      const confirmOverlay = $('confirmOverlay'), confirmTitle = $('confirmTitle');
      const confirmOk = $('confirmOk'), confirmCancel = $('confirmCancel');

      // ---------- constants ----------
      const SESSIONS_KEY = 'bs_sessions';
      const MATCH_PLAYER_KEY = 'bs_match_player_id';
      const NAME_KEY = 'bs_name';
      const CPU_SERIES_KEY = 'bs_cpu_series';
      const ROOM_UNAVAILABLE_MESSAGE = 'Could not join that room. It may be full or no longer available.';
      const ROOM_GONE_PATTERN = /not found|room is full|is full|expired|closed|invalid|gone|does not exist/i;
      const FALLBACK_API_BASE = 'https://1v1.nz';
      const CONNECT_TIMEOUT_MS = 8000;
      const MESSAGE_WATCHDOG_MS = 45000;
      const MAX_CONNECT_FAILURES = 4;
      const ACTION_ACK_MS = 6000; // action ack timeout: requeue + reconnect + resend, never freeze
      const SHIP_DEFS = [
        { name: 'Carrier', size: 5, art: 'assets/ship-carrier.png' },
        { name: 'Battleship', size: 4, art: 'assets/ship-battleship.png' },
        { name: 'Cruiser', size: 3, art: 'assets/ship-cruiser.png' },
        { name: 'Submarine', size: 3, art: 'assets/ship-submarine.png' },
        { name: 'Destroyer', size: 2, art: 'assets/ship-destroyer.png' },
      ];

      // ---------- storage ----------
      const memFallbackStore = {};
      function storeGet(key) {
        try { return window.localStorage.getItem(key); }
        catch (_) { return Object.prototype.hasOwnProperty.call(memFallbackStore, key) ? memFallbackStore[key] : null; }
      }
      function storeSet(key, value) {
        try { window.localStorage.setItem(key, value); }
        catch (_) { memFallbackStore[key] = value; }
      }

      // ---------- small helpers ----------
      let audio;
      function sound(freq, win = false) {
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === 'suspended') audio.resume();
          const now = audio.currentTime;
          const o = audio.createOscillator(), g = audio.createGain();
          o.type = 'sine'; o.frequency.setValueAtTime(freq, now);
          if (win) o.frequency.exponentialRampToValueAtTime(freq * 1.7, now + .22);
          g.gain.setValueAtTime(.065, now); g.gain.exponentialRampToValueAtTime(.001, now + (win ? .32 : .12));
          o.connect(g); g.connect(audio.destination); o.start(); o.stop(now + (win ? .34 : .14));
        } catch (_) {}
      }
      function soundWhoosh(ms = 560) {
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === 'suspended') audio.resume();
          const now = audio.currentTime;
          const dur = Math.max(0.2, Math.min(0.8, ms / 1000));
          const o = audio.createOscillator(), g = audio.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(220, now);
          o.frequency.exponentialRampToValueAtTime(780, now + dur * 0.85);
          g.gain.setValueAtTime(.001, now);
          g.gain.exponentialRampToValueAtTime(.028, now + 0.04);
          g.gain.exponentialRampToValueAtTime(.001, now + dur);
          o.connect(g); g.connect(audio.destination);
          o.start(now); o.stop(now + dur + 0.02);
        } catch (_) {}
      }
      const TORPEDO_MS = 560;
      /** Short projectile streak toward cell (r,c). from: 'bottom'|'top'|'left'. */
      function animateTorpedo(gridEl, r, c, from = 'bottom') {
        return new Promise(resolve => {
          const finish = () => resolve();
          if (!gridEl) return finish();
          const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const cell = gridEl.querySelector(':scope > .bcell[data-row="' + r + '"][data-col="' + c + '"]');
          if (!cell || reduce) {
            if (!reduce) soundWhoosh(120);
            return setTimeout(finish, reduce ? 0 : 80);
          }
          const gridRect = gridEl.getBoundingClientRect();
          const cellRect = cell.getBoundingClientRect();
          if (gridRect.width < 1 || cellRect.width < 1) return finish();
          const destX = cellRect.left - gridRect.left + cellRect.width / 2;
          const destY = cellRect.top - gridRect.top + cellRect.height / 2;
          let startX, startY;
          if (from === 'top') {
            startX = gridRect.width * 0.5;
            startY = -6;
          } else if (from === 'left') {
            startX = -6;
            startY = gridRect.height * 0.5;
          } else {
            // from fleet / bottom of enemy board
            startX = gridRect.width * 0.5;
            startY = gridRect.height + 6;
          }
          const dx = destX - startX, dy = destY - startY;
          const rot = Math.atan2(dy, dx) * 180 / Math.PI + 90; // art points "up"
          const el = document.createElement('div');
          el.className = 'torpedo-flight';
          el.setAttribute('aria-hidden', 'true');
          el.style.left = startX + 'px';
          el.style.top = startY + 'px';
          el.style.setProperty('--dx', dx + 'px');
          el.style.setProperty('--dy', dy + 'px');
          el.style.setProperty('--rot', rot + 'deg');
          el.style.setProperty('--tms', TORPEDO_MS + 'ms');
          gridEl.appendChild(el);
          soundWhoosh(TORPEDO_MS);
          setTimeout(() => { try { el.remove(); } catch (_) {} finish(); }, TORPEDO_MS + 20);
        });
      }
      function cleanCode(value) {
        return String(value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
      }
      function validName() {
        const value = displayName.value.trim().replace(/\s+/g, ' ').slice(0, 24);
        if (!value) {
          onlineError.textContent = 'Enter a display name first.';
          displayName.focus();
          return '';
        }
        try { storeSet(NAME_KEY, value); } catch (_) {}
        return value;
      }
      let errBannerTimer = 0;
      function showErrorBanner(text) {
        if (!text) return;
        errBanner.textContent = text;
        errBanner.hidden = false;
        requestAnimationFrame(() => errBanner.classList.add('show'));
        clearTimeout(errBannerTimer);
        errBannerTimer = setTimeout(() => {
          errBanner.classList.remove('show');
          setTimeout(() => { errBanner.hidden = true; }, 300);
        }, 4200);
      }
      // In-page confirmation dialog (replaces native confirm(), which is
      // unreliable inside mobile browsers and automated views).
      let confirmResolve = null;
      function showConfirm(message, okLabel) {
        return new Promise(resolve => {
          confirmTitle.textContent = message;
          confirmOk.textContent = okLabel || 'Confirm';
          confirmOverlay.hidden = false;
          confirmResolve = resolve;
          confirmCancel.focus();
        });
      }
      function closeConfirm(result) {
        confirmOverlay.hidden = true;
        if (confirmResolve) { confirmResolve(result); confirmResolve = null; }
      }
      function inviteLinkFor(s) {
        return `https://1v1.nz/battleship/?code=${encodeURIComponent(s.code)}`;
      }
      async function shareInviteLink(s, button) {
        if (!s) return;
        const url = inviteLinkFor(s);
        if (navigator.share) {
          try { await navigator.share({ title: 'Play Battleship with me', url }); } catch (_) {}
          return;
        }
        try { await navigator.clipboard.writeText(url); }
        catch (_) {
          const area = document.createElement('textarea');
          area.value = url; area.style.position = 'fixed'; area.style.opacity = '0';
          document.body.appendChild(area); area.select();
          try { document.execCommand('copy'); } catch (_) {}
          area.remove();
        }
        if (button) {
          const original = button.textContent;
          button.textContent = 'Link copied';
          setTimeout(() => { button.textContent = original; }, 1600);
        }
      }

      // ---------- grid helper ----------
      function buildGrid(el) {
        el.innerHTML = '';
        const cells = [];
        for (let r = 0; r < 10; r++) {
          cells.push([]);
          for (let c = 0; c < 10; c++) {
            const cell = document.createElement('button');
            cell.type = 'button';
            cell.className = 'bcell';
            cell.dataset.row = r; cell.dataset.col = c;
            cell.style.gridRow = String(r + 1);
            cell.style.gridColumn = String(c + 1);
            cell.setAttribute('role', 'gridcell');
            cell.setAttribute('aria-label', `Row ${r + 1}, column ${c + 1}`);
            el.appendChild(cell);
            cells[r].push(cell);
          }
        }
        observeShipSpriteLayout(el);
        return cells;
      }

      // ---------- ship sprites (pinned to measured cell boxes) ----------
      function shipCellsNorm(ship) {
        const raw = Array.isArray(ship.cells) ? ship.cells : [];
        return raw.map(cell => {
          if (Array.isArray(cell)) return [cell[0] | 0, cell[1] | 0];
          if (cell && typeof cell === 'object') return [cell.r | 0, cell.c | 0];
          return [0, 0];
        });
      }
      function resolveShipDefIdx(ship, used) {
        if (Number.isInteger(ship.defIdx) && ship.defIdx >= 0 && ship.defIdx < SHIP_DEFS.length && !used.has(ship.defIdx)) {
          used.add(ship.defIdx);
          return ship.defIdx;
        }
        const size = shipCellsNorm(ship).length;
        for (let d = 0; d < SHIP_DEFS.length; d++) {
          if (SHIP_DEFS[d].size === size && !used.has(d)) {
            used.add(d);
            return d;
          }
        }
        return 0;
      }
      /** Expected coverage cells for a sprite at (r0,c0) with size/orientation. */
      function spriteCoverageCells(r0, c0, size, horizontal) {
        const out = [];
        for (let i = 0; i < size; i++) out.push(horizontal ? [r0, c0 + i] : [r0 + i, c0]);
        return out;
      }
      function cellKeys(cells) {
        return cells.map(([r, c]) => r + ',' + c).sort().join('|');
      }
      /** Position a .ship-sprite from getBoundingClientRect of start/end bcells (relative to .bgrid). */
      function layoutShipSprite(gridEl, el, r0, c0, size, horizontal) {
        if (!gridEl || !el) return;
        const endR = horizontal ? r0 : r0 + size - 1;
        const endC = horizontal ? c0 + size - 1 : c0;
        const start = gridEl.querySelector(':scope > .bcell[data-row="' + r0 + '"][data-col="' + c0 + '"]');
        const end = gridEl.querySelector(':scope > .bcell[data-row="' + endR + '"][data-col="' + endC + '"]');
        if (!start || !end) return;
        const gridRect = gridEl.getBoundingClientRect();
        const sRect = start.getBoundingClientRect();
        const eRect = end.getBoundingClientRect();
        if (gridRect.width < 1 || sRect.width < 1) return; // hidden / not laid out yet
        const left = sRect.left - gridRect.left;
        const top = sRect.top - gridRect.top;
        const width = eRect.right - sRect.left;
        const height = eRect.bottom - sRect.top;
        el.style.position = 'absolute';
        el.style.left = left + 'px';
        el.style.top = top + 'px';
        el.style.width = width + 'px';
        el.style.height = height + 'px';
        el.style.gridRow = '';
        el.style.gridColumn = '';
        el.style.setProperty('--size', String(size));
        el.style.setProperty('--box-w', width + 'px');
        el.style.setProperty('--box-h', height + 'px');
        el.dataset.r0 = String(r0);
        el.dataset.c0 = String(c0);
        el.dataset.size = String(size);
        el.dataset.orient = horizontal ? 'h' : 'v';
      }
      function relayoutShipSprites(gridEl) {
        if (!gridEl) return;
        gridEl.querySelectorAll(':scope > .ship-sprite').forEach(el => {
          const r0 = +el.dataset.r0, c0 = +el.dataset.c0, size = +el.dataset.size;
          const horizontal = el.dataset.orient === 'h';
          if (Number.isFinite(r0) && Number.isFinite(c0) && size > 0) {
            layoutShipSprite(gridEl, el, r0, c0, size, horizontal);
          }
        });
      }
      function observeShipSpriteLayout(gridEl) {
        if (!gridEl || gridEl._shipSpriteRO) return;
        const ro = new ResizeObserver(() => relayoutShipSprites(gridEl));
        ro.observe(gridEl);
        gridEl._shipSpriteRO = ro;
      }
      function syncShipSprites(gridEl, ships) {
        if (!gridEl) return;
        observeShipSpriteLayout(gridEl);
        gridEl.querySelectorAll(':scope > .ship-sprite:not(.ghost)').forEach(el => el.remove());
        if (!Array.isArray(ships) || !ships.length) return;
        const used = new Set();
        for (const ship of ships) {
          const cells = shipCellsNorm(ship);
          if (!cells.length) continue;
          const defIdx = resolveShipDefIdx(ship, used);
          const rows = cells.map(([r]) => r), cols = cells.map(([, c]) => c);
          const r0 = Math.min(...rows), c0 = Math.min(...cols);
          const size = cells.length;
          const horizontal = rows.every(v => v === rows[0]);
          // Sanity: logical ship cells must equal sprite coverage for (r0,c0,size,orient).
          const cover = spriteCoverageCells(r0, c0, size, horizontal);
          if (cellKeys(cells) !== cellKeys(cover)) {
            console.warn('[battleship] ship cells ≠ sprite coverage', cells, cover);
          }
          const el = document.createElement('div');
          el.className = 'ship-sprite ' + (horizontal ? 'horiz' : 'vert');
          if (ship.sunk) el.classList.add('sunk');
          else if (Array.isArray(ship.hits) && ship.hits.length) el.classList.add('hit');
          el.setAttribute('aria-hidden', 'true');
          const img = document.createElement('img');
          img.src = SHIP_DEFS[defIdx].art;
          img.alt = '';
          img.draggable = false;
          el.appendChild(img);
          if (ship.sunk) {
            const smoke = document.createElement('span');
            smoke.className = 'wreck-smoke';
            smoke.setAttribute('aria-hidden', 'true');
            for (let i = 0; i < 3; i++) {
              const puff = document.createElement('i');
              puff.style.setProperty('--sx', (28 + i * 22) + '%');
              puff.style.setProperty('--sy', (30 + (i % 2) * 18) + '%');
              puff.style.setProperty('--dur', (2.1 + i * 0.35) + 's');
              puff.style.setProperty('--delay', (i * 0.45) + 's');
              puff.style.setProperty('--drift', ((i - 1) * 8) + 'px');
              smoke.appendChild(puff);
            }
            el.appendChild(smoke);
          }
          gridEl.appendChild(el);
          layoutShipSprite(gridEl, el, r0, c0, size, horizontal);
        }
        requestAnimationFrame(() => relayoutShipSprites(gridEl));
      }

      // ---------- fleet validation ----------
      function validateFleet(ships) {
        if (!Array.isArray(ships) || ships.length !== 5) return { ok: false, error: 'Place all 5 ships.' };
        const sizes = ships.map(s => (s.cells || []).length).sort((a, b) => a - b);
        const want = [2, 3, 3, 4, 5];
        for (let i = 0; i < 5; i++) {
          if (sizes[i] !== want[i]) return { ok: false, error: 'Ships must be sizes 5, 4, 3, 3 and 2.' };
        }
        const seen = new Set();
        for (const ship of ships) {
          const cells = ship.cells || [];
          const rows = cells.map(([r]) => r), cols = cells.map(([, c]) => c);
          for (const [r, c] of cells) {
            if (!Number.isInteger(r) || !Number.isInteger(c) || r < 0 || r > 9 || c < 0 || c > 9)
              return { ok: false, error: 'Ships must stay inside the 10×10 grid.' };
            const key = r + ',' + c;
            if (seen.has(key)) return { ok: false, error: 'Ships may not overlap.' };
            seen.add(key);
          }
          const sameRow = rows.every(v => v === rows[0]);
          const sameCol = cols.every(v => v === cols[0]);
          if (!sameRow && !sameCol) return { ok: false, error: 'Ships must be straight lines.' };
          const line = (sameRow ? cols : rows).slice().sort((a, b) => a - b);
          for (let i = 1; i < line.length; i++) {
            if (line[i] !== line[i - 1] + 1) return { ok: false, error: 'Ships must be contiguous.' };
          }
        }
        return { ok: true, error: '' };
      }
      function randomFleet() {
        // Random valid placement, sizes in SHIP_DEFS order (carrier first).
        for (let attempt = 0; attempt < 60; attempt++) {
          const ships = [];
          const occupied = new Set();
          let failed = false;
          for (let d = 0; d < SHIP_DEFS.length; d++) {
            const size = SHIP_DEFS[d].size;
            let placed = false;
            for (let t = 0; t < 120 && !placed; t++) {
              const horiz = Math.random() < 0.5;
              const r = (Math.random() * 10) | 0, c = (Math.random() * 10) | 0;
              const cells = [];
              for (let i = 0; i < size; i++) cells.push(horiz ? [r, c + i] : [r + i, c]);
              if (cells.some(([rr, cc]) => rr > 9 || cc > 9 || occupied.has(rr + ',' + cc))) continue;
              cells.forEach(([rr, cc]) => occupied.add(rr + ',' + cc));
              ships.push({ defIdx: d, cells });
              placed = true;
            }
            if (!placed) { failed = true; break; }
          }
          if (!failed && validateFleet(ships).ok) return ships;
        }
        // Practically unreachable; fall back to a fixed legal layout.
        return [
          { defIdx: 0, cells: [[0,0],[0,1],[0,2],[0,3],[0,4]] },
          { defIdx: 1, cells: [[2,0],[2,1],[2,2],[2,3]] },
          { defIdx: 2, cells: [[4,0],[4,1],[4,2]] },
          { defIdx: 3, cells: [[6,0],[6,1],[6,2]] },
          { defIdx: 4, cells: [[8,0],[8,1]] },
        ];
      }

      // ---------- placement UI (shared by CPU + online) ----------
      // onReady(ships) is called when the player confirms a full valid fleet.
      function createPlacementUI(root, onReady) {
        root.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'place-ui';
        const hint = document.createElement('p');
        hint.className = 'place-hint';
        const palette = document.createElement('div');
        palette.className = 'palette';
        const tools = document.createElement('div');
        tools.className = 'row';
        const orientBtn = document.createElement('button');
        orientBtn.type = 'button'; orientBtn.className = 'btn sm ghost'; orientBtn.textContent = '⟳ Horizontal';
        const randomBtn = document.createElement('button');
        randomBtn.type = 'button'; randomBtn.className = 'btn sm ghost'; randomBtn.textContent = 'Random';
        const clearBtn = document.createElement('button');
        clearBtn.type = 'button'; clearBtn.className = 'btn sm ghost'; clearBtn.textContent = 'Clear';
        tools.append(orientBtn, randomBtn, clearBtn);
        const gridEl = document.createElement('div');
        gridEl.className = 'bgrid place-grid';
        gridEl.setAttribute('role', 'grid');
        gridEl.setAttribute('aria-label', 'Place your ships');
        const cells = buildGrid(gridEl);
        const readyBtn = document.createElement('button');
        readyBtn.type = 'button'; readyBtn.className = 'btn primary ready'; readyBtn.disabled = true;
        const waitMsg = document.createElement('p');
        waitMsg.className = 'place-wait'; waitMsg.hidden = true;
        waitMsg.textContent = 'Waiting for opponent to place…';
        wrap.append(hint, palette, tools, gridEl, readyBtn, waitMsg);
        root.appendChild(wrap);

        const shipBtns = SHIP_DEFS.map((def, d) => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'shipbtn';
          b.innerHTML = '';
          const thumb = document.createElement('img');
          thumb.className = 'ship-thumb'; thumb.src = def.art; thumb.alt = ''; thumb.draggable = false;
          const meta = document.createElement('span'); meta.className = 'shipbtn-meta';
          const label = document.createElement('span'); label.textContent = def.name;
          const pips = document.createElement('span'); pips.className = 'pips'; pips.textContent = '●'.repeat(def.size);
          meta.append(label, pips);
          b.append(thumb, meta);
          b.addEventListener('click', () => { if (!locked && !isPlaced(d)) { selected = d; clearGhost(); render(); } });
          palette.appendChild(b);
          return b;
        });

        let ships = [];            // [{defIdx, cells:[[r,c],...]}]
        let selected = 0;
        let horizontal = true;
        let locked = false;
        let shipAt = new Map();    // "r,c" -> ship index
        let ghostEl = null;
        let lastHover = null;
        let invalidFlashTimer = 0;

        function isPlaced(d) { return ships.some(s => s.defIdx === d); }
        function rebuildIndex() {
          shipAt = new Map();
          ships.forEach((s, i) => s.cells.forEach(([r, c]) => shipAt.set(r + ',' + c, i)));
        }
        function nextUnplaced() {
          for (let d = 0; d < SHIP_DEFS.length; d++) if (!isPlaced(d)) return d;
          return -1;
        }
        function removeGhostEl() {
          if (ghostEl) { ghostEl.remove(); ghostEl = null; }
        }
        function clearGhost() {
          removeGhostEl();
          lastHover = null;
        }
        function showGhost(r, c) {
          lastHover = { r, c };
          removeGhostEl();
          if (locked || selected < 0 || isPlaced(selected)) return;
          if (shipAt.has(r + ',' + c)) return;
          const size = SHIP_DEFS[selected].size;
          const preview = [];
          for (let i = 0; i < size; i++) preview.push(horizontal ? [r, c + i] : [r + i, c]);
          const valid = !preview.some(([rr, cc]) => rr < 0 || rr > 9 || cc < 0 || cc > 9 || shipAt.has(rr + ',' + cc));
          ghostEl = document.createElement('div');
          ghostEl.className = 'ship-sprite ghost ' + (horizontal ? 'horiz' : 'vert') + (valid ? ' valid' : ' invalid');
          ghostEl.setAttribute('aria-hidden', 'true');
          const img = document.createElement('img');
          img.src = SHIP_DEFS[selected].art;
          img.alt = '';
          img.draggable = false;
          ghostEl.appendChild(img);
          gridEl.appendChild(ghostEl);
          layoutShipSprite(gridEl, ghostEl, r, c, size, horizontal);
          requestAnimationFrame(() => {
            if (ghostEl) layoutShipSprite(gridEl, ghostEl, r, c, size, horizontal);
          });
        }
        function cellFromPoint(clientX, clientY) {
          const el = document.elementFromPoint(clientX, clientY);
          const cell = el && el.closest ? el.closest('.bcell') : null;
          if (!cell || !gridEl.contains(cell)) return null;
          return { r: +cell.dataset.row, c: +cell.dataset.col };
        }
        function flashInvalid(preview) {
          clearTimeout(invalidFlashTimer);
          for (const [rr, cc] of preview) {
            if (rr < 0 || rr > 9 || cc < 0 || cc > 9) continue;
            cells[rr][cc].classList.add('invalid');
          }
          invalidFlashTimer = setTimeout(() => {
            for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) cells[r][c].classList.remove('invalid');
          }, 300);
        }
        function markJustPlaced() {
          const sprites = gridEl.querySelectorAll(':scope > .ship-sprite:not(.ghost)');
          const el = sprites[sprites.length - 1];
          if (!el) return;
          el.classList.add('just-placed');
          setTimeout(() => el.classList.remove('just-placed'), 200);
        }
        function render() {
          rebuildIndex();
          for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) {
            const cell = cells[r][c];
            const keepInvalid = cell.classList.contains('invalid');
            cell.className = 'bcell' + (shipAt.has(r + ',' + c) ? ' ship' : '') + (keepInvalid ? ' invalid' : '');
          }
          syncShipSprites(gridEl, ships);
          shipBtns.forEach((b, d) => {
            b.classList.toggle('placed', isPlaced(d));
            b.classList.toggle('selected', !locked && selected === d && !isPlaced(d));
          });
          readyBtn.disabled = locked || ships.length !== 5;
          readyBtn.textContent = `Ready — fleet ${ships.length}/5`;
          readyBtn.classList.toggle('ready-pulse', !locked && ships.length === 5);
          if (!locked) {
            if (ships.length === 5) hint.textContent = 'Fleet complete — tap Ready to battle!';
            else if (selected >= 0) hint.textContent = `Placing ${SHIP_DEFS[selected].name} (${SHIP_DEFS[selected].size}) — tap a start square. Tap a placed ship to remove it.`;
            else hint.textContent = 'Pick a ship, then tap a start square. Tap a placed ship to remove it.';
          }
          if (lastHover && !locked) showGhost(lastHover.r, lastHover.c);
          else removeGhostEl();
        }
        function tryPlace(r, c) {
          if (locked || selected < 0 || isPlaced(selected)) return;
          const size = SHIP_DEFS[selected].size;
          const preview = [];
          for (let i = 0; i < size; i++) preview.push(horizontal ? [r, c + i] : [r + i, c]);
          if (preview.some(([rr, cc]) => rr < 0 || rr > 9 || cc < 0 || cc > 9 || shipAt.has(rr + ',' + cc))) {
            hint.textContent = 'No room there — pick another square or flip orientation.';
            sound(180);
            flashInvalid(preview);
            return;
          }
          ships.push({ defIdx: selected, cells: preview });
          selected = nextUnplaced();
          sound(520);
          clearGhost();
          render();
          markJustPlaced();
        }
        cells.flat().forEach(cell => {
          cell.addEventListener('click', () => {
            if (locked) return;
            const r = +cell.dataset.row, c = +cell.dataset.col;
            const idx = shipAt.get(r + ',' + c);
            if (idx !== undefined) {
              const removed = ships.splice(idx, 1)[0];
              selected = removed.defIdx;
              sound(300);
              clearGhost();
              render();
              return;
            }
            tryPlace(r, c);
          });
        });
        gridEl.addEventListener('mousemove', (e) => {
          if (locked) return;
          const pos = cellFromPoint(e.clientX, e.clientY);
          if (!pos) { clearGhost(); return; }
          showGhost(pos.r, pos.c);
        });
        gridEl.addEventListener('mouseleave', () => { clearGhost(); });
        gridEl.addEventListener('touchmove', (e) => {
          if (locked || !e.touches || !e.touches[0]) return;
          const t = e.touches[0];
          const pos = cellFromPoint(t.clientX, t.clientY);
          if (!pos) { clearGhost(); return; }
          showGhost(pos.r, pos.c);
        }, { passive: true });
        orientBtn.addEventListener('click', () => {
          horizontal = !horizontal;
          orientBtn.textContent = horizontal ? '⟳ Horizontal' : '⟳ Vertical';
          render();
        });
        randomBtn.addEventListener('click', () => {
          if (locked) return;
          ships = randomFleet();
          selected = -1;
          sound(660);
          clearGhost();
          render();
        });
        clearBtn.addEventListener('click', () => {
          if (locked) return;
          ships = []; selected = 0;
          clearGhost();
          render();
        });
        readyBtn.addEventListener('click', () => {
          if (locked || ships.length !== 5) return;
          const check = validateFleet(ships);
          if (!check.ok) { hint.textContent = check.error; return; }
          onReady(ships.map(s => ({ defIdx: s.defIdx, cells: s.cells.map(([r, c]) => [r, c]) })));
        });

        render();
        return {
          reset() {
            ships = []; selected = 0; horizontal = true; locked = false;
            orientBtn.textContent = '⟳ Horizontal';
            waitMsg.hidden = true;
            readyBtn.style.display = '';
            clearGhost();
            render();
          },
          getShips() { return ships.map(s => ({ defIdx: s.defIdx, cells: s.cells.map(([r, c]) => [r, c]) })); },
          setSending() {
            locked = true;
            readyBtn.disabled = true;
            readyBtn.classList.remove('ready-pulse');
            readyBtn.textContent = 'Sending…';
            hint.textContent = '';
            clearGhost();
          },
          unlock() {
            // Back to editable without wiping the player's layout (e.g. the
            // server rejected the fleet, or we came back to a stale view).
            locked = false;
            readyBtn.style.display = '';
            waitMsg.hidden = true;
            render();
          },
          setWaiting() {
            locked = true;
            readyBtn.disabled = true;
            readyBtn.classList.remove('ready-pulse');
            readyBtn.style.display = 'none';
            waitMsg.hidden = false;
            hint.textContent = '';
            clearGhost();
          },
        };
      }

      // ---------- VS COMPUTER ----------
      let difficulty = 'hard';
      try { difficulty = storeGet('bs_cpu_diff') || 'hard'; } catch (_) {}
      const cpu = {
        phase: 'place', // place | battle | over
        myFleet: [], cpuFleet: [],
        myShots: null, cpuShots: null,
        turn: 'you', busy: false,
        aiHits: [], mySunk: new Set(), cpuSunk: new Set(),
        last: null, // {by:'you'|'cpu', r, c}
      };
      let cpuSeries = { w: 0, l: 0 };
      try {
        const saved = JSON.parse(storeGet(CPU_SERIES_KEY) || 'null');
        if (saved) cpuSeries = { w: Math.max(0, saved.w | 0), l: Math.max(0, saved.l | 0) };
      } catch (_) {}
      function persistCpuSeries() {
        renderCpuSeries();
        try { storeSet(CPU_SERIES_KEY, JSON.stringify(cpuSeries)); } catch (_) {}
      }
      function renderCpuSeries() {
        cpuSeriesLabel.textContent = `${cpuSeries.w}–${cpuSeries.l}`;
        cpuSeriesText.textContent = `${cpuSeries.w}–${cpuSeries.l}`;
      }
      const cpuEnemyCells = buildGrid(cpuEnemyGrid);
      const cpuOwnCells = buildGrid(cpuOwnGrid);

      const cpuPlaceUI = createPlacementUI(cpuPlace, ships => {
        cpu.myFleet = ships.map(s => ({ ...s, hits: [], sunk: false }));
        cpu.cpuFleet = randomFleet().map(s => ({ ...s, hits: [], sunk: false }));
        cpu.myShots = Array.from({ length: 10 }, () => Array(10).fill(0));
        cpu.cpuShots = Array.from({ length: 10 }, () => Array(10).fill(0));
        cpu.mySunk = new Set(); cpu.cpuSunk = new Set();
        cpu.aiHits = []; cpu.last = null; cpu.turn = 'you'; cpu.busy = false;
        cpu.phase = 'battle';
        cpuPlace.hidden = true;
        cpuBattle.hidden = false;
        renderCpuBattle();
        cpuStatus.innerHTML = 'Your move — tap enemy waters to fire';
      });

      function fleetSunk(fleet) { return fleet.every(s => s.sunk); }
      function applyShotToFleet(fleet, sunkSet, r, c) {
        // Returns {hit, sunk} and records the hit on the fleet.
        for (const ship of fleet) {
          if (ship.cells.some(([sr, sc]) => sr === r && sc === c)) {
            if (!ship.hits.some(([hr, hc]) => hr === r && hc === c)) ship.hits.push([r, c]);
            const sunk = ship.cells.every(([sr, sc]) => ship.hits.some(([hr, hc]) => hr === sr && hc === sc));
            if (sunk && !ship.sunk) {
              ship.sunk = true;
              ship.cells.forEach(([sr, sc]) => sunkSet.add(sr + ',' + sc));
            }
            return { hit: true, sunk: ship.sunk };
          }
        }
        return { hit: false, sunk: false };
      }

      function renderCpuBattle() {
        for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) {
          const v = cpu.myShots[r][c];
          const cell = cpuEnemyCells[r][c];
          cell.className = 'bcell' +
            (cpu.mySunk.has(r + ',' + c) ? ' sunk' : v === 2 ? ' hit' : v === 1 ? ' miss' : '');
          cell.setAttribute('aria-label', `Enemy row ${r + 1}, column ${c + 1}, ` +
            (cpu.mySunk.has(r + ',' + c) ? 'sunk' : v === 2 ? 'hit' : v === 1 ? 'miss' : 'unknown'));
        }
        const hitSet = new Set();
        for (const ship of cpu.myFleet) {
          ship.cells.forEach(([r, c]) => {
            const key = r + ',' + c;
            const wasHit = ship.hits.some(([hr, hc]) => hr === r && hc === c);
            if (wasHit) hitSet.add(key);
            cpuOwnCells[r][c].className = 'bcell ' + (ship.sunk ? 'shipsunk' : wasHit ? 'shiphit' : 'ship');
          });
        }
        for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) {
          if (hitSet.has(r + ',' + c)) continue;
          const v = cpu.cpuShots[r][c];
          if (v) {
            cpuOwnCells[r][c].className = 'bcell ' + (v === 2 ? 'hit' : 'miss');
            cpuOwnCells[r][c].setAttribute('aria-label', `Your row ${r + 1}, column ${c + 1}, ${v === 2 ? 'hit by enemy' : 'enemy miss'}`);
          }
        }
        syncShipSprites(cpuOwnGrid, cpu.myFleet);
        // last-shot highlight
        cpuEnemyCells.flat().forEach(el => el.classList.remove('last'));
        cpuOwnCells.flat().forEach(el => el.classList.remove('last'));
        if (cpu.last) {
          const grid = cpu.last.by === 'you' ? cpuEnemyCells : cpuOwnCells;
          grid[cpu.last.r][cpu.last.c].classList.add('last');
        }
      }

      function cpuPlayerFire(r, c) {
        if (cpu.phase !== 'battle' || cpu.turn !== 'you' || cpu.busy) return;
        if (r < 0 || r > 9 || c < 0 || c > 9 || cpu.myShots[r][c] !== 0) return;
        cpu.busy = true;
        animateTorpedo(cpuEnemyGrid, r, c, 'bottom').then(() => {
          if (cpu.phase !== 'battle') { cpu.busy = false; return; }
          const res = applyShotToFleet(cpu.cpuFleet, cpu.mySunk, r, c);
          cpu.myShots[r][c] = res.hit ? 2 : 1;
          cpu.last = { by: 'you', r, c };
          sound(res.hit ? 740 : 240);
          renderCpuBattle();
          if (fleetSunk(cpu.cpuFleet)) { cpuEnd(true); return; }
          cpu.turn = 'cpu';
          cpuStatus.textContent = res.sunk ? `You sunk their ${sunkName(cpu.cpuFleet, r, c)}! CPU is thinking…` : res.hit ? 'Hit! CPU is thinking…' : 'Miss. CPU is thinking…';
          setTimeout(cpuMove, 620);
        });
      }
      function sunkName(fleet, r, c) {
        const ship = fleet.find(s => s.sunk && s.cells.some(([sr, sc]) => sr === r && sc === c));
        return ship ? SHIP_DEFS[ship.defIdx].name : 'ship';
      }
      const cpuNeighbors = (r, c) => [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]
        .filter(([rr, cc]) => rr >= 0 && rr < 10 && cc >= 0 && cc < 10 && cpu.cpuShots[rr][cc] === 0);
      function cpuEasyPick() {
        const open = [];
        for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) if (cpu.cpuShots[r][c] === 0) open.push([r, c]);
        return open.length ? open[(Math.random() * open.length) | 0] : null;
      }
      function cpuHardPick() {
        // Hunt/target: checkerboard-parity hunt; on a hit, try orthogonal
        // neighbours; extend along the line when two hits align; resume the
        // hunt after a sink.
        if (cpu.aiHits.length > 0) {
          let cands = [];
          if (cpu.aiHits.length === 1) {
            const [r, c] = cpu.aiHits[0];
            cands = cpuNeighbors(r, c);
          } else {
            const rs = cpu.aiHits.map(h => h[0]), cs = cpu.aiHits.map(h => h[1]);
            const vertical = new Set(cs).size === 1 && new Set(rs).size > 1;
            const sorted = cpu.aiHits.slice().sort((a, b) => vertical ? a[0] - b[0] : a[1] - b[1]);
            const first = sorted[0], last = sorted[sorted.length - 1];
            const ends = vertical
              ? [[first[0] - 1, first[1]], [last[0] + 1, last[1]]]
              : [[first[0], first[1] - 1], [last[0], last[1] + 1]];
            cands = ends.filter(([r, c]) => r >= 0 && r < 10 && c >= 0 && c < 10 && cpu.cpuShots[r][c] === 0);
            if (!cands.length) {
              const seen = new Set();
              for (const [r, c] of cpu.aiHits) for (const [nr, nc] of cpuNeighbors(r, c)) {
                const k = nr + ',' + nc;
                if (!seen.has(k)) { seen.add(k); cands.push([nr, nc]); }
              }
            }
          }
          if (cands.length) return cands[(Math.random() * cands.length) | 0];
          cpu.aiHits = []; // stale hits (shouldn't happen) — resume hunt
        }
        const parity = [];
        for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++)
          if ((r + c) % 2 === 0 && cpu.cpuShots[r][c] === 0) parity.push([r, c]);
        if (parity.length) return parity[(Math.random() * parity.length) | 0];
        return cpuEasyPick(); // endgame mop-up
      }
      function cpuMove() {
        if (cpu.phase !== 'battle' || cpu.turn !== 'cpu') { cpu.busy = false; return; }
        const pick = difficulty === 'hard' ? cpuHardPick() : cpuEasyPick();
        if (!pick) { cpu.busy = false; return; }
        const [r, c] = pick;
        // Stay busy through travel so the player cannot fire mid-flight.
        animateTorpedo(cpuOwnGrid, r, c, 'top').then(() => {
          if (cpu.phase !== 'battle') { cpu.busy = false; return; }
          const res = applyShotToFleet(cpu.myFleet, cpu.cpuSunk, r, c);
          cpu.cpuShots[r][c] = res.hit ? 2 : 1;
          cpu.last = { by: 'cpu', r, c };
          if (difficulty === 'hard') {
            if (res.sunk) cpu.aiHits = [];
            else if (res.hit) cpu.aiHits.push([r, c]);
          }
          sound(res.hit ? 520 : 220);
          renderCpuBattle();
          cpu.busy = false;
          if (fleetSunk(cpu.myFleet)) { cpuEnd(false); return; }
          cpu.turn = 'you';
          cpuStatus.innerHTML = res.sunk
            ? `CPU sunk your <b>${sunkName(cpu.myFleet, r, c)}</b>! Your move`
            : res.hit ? 'CPU hit one of your ships! Your move' : 'CPU missed. Your move';
        });
      }
      function cpuEnd(won) {
        cpu.phase = 'over';
        cpu.busy = false;
        if (won) { cpuSeries.w++; sound(520, true); } else { cpuSeries.l++; sound(200); }
        persistCpuSeries();
        cpuResultText.textContent = won ? '🎉 You win!' : '💥 CPU wins';
        cpuStatus.innerHTML = won ? '<span class="turn-you">You win!</span>' : '<span class="turn-them">CPU wins</span>';
        gameOverlay.hidden = false;
      }
      function cpuNewGame() {
        cpu.phase = 'place';
        cpu.busy = false;
        gameOverlay.hidden = true;
        cpuBattle.hidden = true;
        cpuPlace.hidden = false;
        cpuPlaceUI.reset();
        cpuStatus.textContent = 'Place your fleet';
      }
      cpuEnemyCells.flat().forEach(cell => {
        cell.addEventListener('click', () => cpuPlayerFire(+cell.dataset.row, +cell.dataset.col));
      });
      cpuPlayAgain.addEventListener('click', cpuNewGame);
      cpuNew.addEventListener('click', cpuNewGame);
      cpuResign.addEventListener('click', async () => {
        if (cpu.phase !== 'battle') return;
        if (await showConfirm('Resign this game?', 'Resign')) cpuEnd(false);
      });
      cpuSeriesReset.addEventListener('click', async () => {
        if (await showConfirm('Reset your series score vs the computer?', 'Reset')) {
          cpuSeries = { w: 0, l: 0 };
          persistCpuSeries();
        }
      });
      diffButtons.forEach(b => b.addEventListener('click', () => {
        difficulty = b.dataset.diff;
        try { storeSet('bs_cpu_diff', difficulty); } catch (_) {}
        diffButtons.forEach(x => x.classList.toggle('active', x === b));
        cpuNewGame();
      }));
      diffButtons.forEach(x => x.classList.toggle('active', x.dataset.diff === difficulty));
      renderCpuSeries();

      // ---------- ONLINE: session store ----------
      let mode = 'cpu';
      let sessions = [];
      let activeSession = null;
      let lobbyNoteTimer = 0;

      // Matchmaker state (declared early so dropSession can reference it).
      let mmSocket = null, mmSearching = false, mmPendingCode = '', mmName = '', mmKeepalive = 0;

      function makeSession(record) {
        const series = (record && record.series) || {};
        return {
          code: cleanCode(record && record.code),
          token: (record && record.token) || '',
          name: (record && record.name) || 'You',
          color: (record && record.color) || 0,
          apiBase: record && 'apiBase' in record ? record.apiBase : null,
          series: { w: Math.max(0, series.w | 0), l: Math.max(0, series.l | 0) },
          socket: null, state: null, seatConfirmed: false,
          intentionalClose: false, superseded: false, dropped: false,
          reconnectAttempt: 0, connectFailures: 0, lastMessageAt: 0,
          phase: 'idle', phaseError: '',
          attention: false,
          shotInFlight: false, placeInFlight: false, resignInFlight: false,
          revealBusy: false, flightPromise: null,
          shotCell: null, shotSentAt: 0, placeSentAt: 0,
          pendingShot: null, pendingPlace: null, pendingResign: false, pendingRematch: false,
          placeShips: null, placeUiLocked: false,
