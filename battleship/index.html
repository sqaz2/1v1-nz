        if (!s.state) return [s.phase === 'reconnecting' ? 'Reconnecting…' : 'Connecting…', 'muted'];
        const st = s.state;
        if (st.status === 'waiting') return ['Waiting', 'muted'];
        if (st.status === 'placement') return ['Placing ships', 'muted'];
        if (st.status === 'over') return ['Finished', 'muted'];
        return st.turn === s.color ? ['Your turn', 'yours'] : ['Their turn', 'theirs'];
      }
      function renderLobby() {
        sessionList.innerHTML = '';
        if (!sessions.length) {
          const empty = document.createElement('p');
          empty.className = 'lobby-empty';
          empty.textContent = 'No online games yet — create one below, find a public match, or join with an invite code.';
          sessionList.appendChild(empty);
          return;
        }
        for (const s of sessions) {
          const entry = document.createElement('div');
          entry.className = 'session-entry' + (s.attention ? ' has-attention' : '');
          entry.setAttribute('role', 'listitem');
          const open = document.createElement('button');
          open.type = 'button';
          open.className = 'session-open';
          open.setAttribute('aria-label', `Open game with ${opponentName(s)}, room ${s.code}`);
          const titleWrap = document.createElement('span');
          titleWrap.className = 'session-title';
          const nameEl = document.createElement('strong');
          nameEl.className = 'session-name';
          nameEl.textContent = opponentName(s);
          const codeEl = document.createElement('span');
          codeEl.className = 'session-code';
          codeEl.textContent = s.code;
          titleWrap.append(nameEl, codeEl);
          const metaEl = document.createElement('span');
          metaEl.className = 'session-meta';
          const [badgeText, badgeKind] = sessionBadge(s);
          const badge = document.createElement('span');
          badge.className = 'session-badge ' + badgeKind;
          badge.textContent = badgeText;
          const series = document.createElement('span');
          series.className = 'session-series';
          series.textContent = `${s.series.w}–${s.series.l}`;
          series.title = 'Series score';
          metaEl.append(badge, series);
          if (s.attention) {
            const dot = document.createElement('span');
            dot.className = 'session-dot';
            dot.setAttribute('aria-label', 'Your turn');
            metaEl.appendChild(dot);
          }
          open.append(titleWrap, metaEl);
          open.addEventListener('click', () => openSession(s.code));
          const leave = document.createElement('button');
          leave.type = 'button';
          leave.className = 'session-leave';
          leave.setAttribute('aria-label', `Leave game ${s.code}`);
          leave.textContent = '✕';
          leave.addEventListener('click', event => { event.stopPropagation(); leaveSession(s); });
          entry.append(open, leave);
          sessionList.appendChild(entry);
        }
      }

      // ---------- ONLINE: game view ----------
      function renderRecoveryBanner(s) {
        takeoverButton.hidden = !s.superseded;
        if (s.superseded) {
          connectionRecovery.hidden = false;
          connectionIndicator.textContent = 'This game is open in another tab.';
          retryGameConnection.hidden = true;
          return;
        }
        if (s.phase === 'connecting' || s.phase === 'reconnecting' || s.phase === 'failed') {
          connectionRecovery.hidden = false;
          connectionIndicator.textContent = s.phase === 'failed'
            ? (s.phaseError || 'Connection lost')
            : s.phase === 'connecting' ? 'Connecting…' : 'Reconnecting…';
          retryGameConnection.hidden = s.phase !== 'failed';
          return;
        }
        connectionRecovery.hidden = true;
        retryGameConnection.hidden = true;
      }
      function renderGameView() {
        const s = activeSession;
        if (!s || mode !== 'online') return;
        onlineSetup.hidden = true;
        matchSearch.hidden = true;
        sessionListWrap.hidden = true;
        gameView.hidden = false;
        ghOpponent.textContent = opponentName(s);
        ghSeries.textContent = `Series ${s.series.w}–${s.series.l}`;
        renderRecoveryBanner(s);
        const st = s.state;
        if (s.superseded) {
          waitingCard.hidden = false;
          onlinePlace.hidden = true;
          onlineBattle.hidden = true;
          onlineGameActions.hidden = true;
          inviteCode.textContent = s.code;
          lobbyStatus.textContent = 'Open in another tab';
          lobbyError.textContent = '';
          return;
        }
        if (!st || st.status === 'waiting') {
          waitingCard.hidden = false;
          onlinePlace.hidden = true;
          onlineBattle.hidden = true;
          onlineGameActions.hidden = true;
          inviteCode.textContent = s.code;
          lobbyError.textContent = '';
          if (s.phase === 'failed') {
            lobbyStatus.textContent = 'Unable to connect';
            lobbyError.textContent = s.phaseError;
            retryLobbyConnection.hidden = false;
          } else {
            lobbyStatus.textContent = s.phase === 'connecting' ? 'Connecting…'
              : s.phase === 'reconnecting' ? 'Reconnecting…' : 'Waiting for opponent…';
            retryLobbyConnection.hidden = true;
          }
          return;
        }
        waitingCard.hidden = true;
        if (st.status === 'placement') {
          onlineBattle.hidden = true;
          onlineGameActions.hidden = true;
          onlinePlace.hidden = false;
          resignButton.hidden = true;
          if (st.placed) {
            onlinePlaceUI.setWaiting();
            onlineStatus.textContent = 'Fleet placed — waiting for opponent…';
          } else {
            // Never leave the UI stuck on "Sending…" (e.g. reopening a saved
            // session whose send never completed).
            if (!s.placeUiLocked) onlinePlaceUI.unlock();
            onlineStatus.textContent = 'Place your fleet';
          }
          return;
        }
        // playing or over
        onlinePlace.hidden = true;
        onlineBattle.hidden = false;
        renderOnlineBattle(s);
        resignButton.hidden = st.status !== 'playing';
        if (st.status === 'over') {
          onlineGameActions.hidden = false;
          const winner = st.winner | 0;
          resultText.textContent = winner === s.color ? '🎉 You win!'
            : winner ? `${opponentName(s)} wins` : "It's a draw";
          seriesText.textContent = `${s.series.w}–${s.series.l}`;
          const rematchColors = Array.isArray(st.rematch) ? st.rematch : [];
          const iWant = rematchColors.includes(s.color);
          const oppWants = rematchColors.some(c => c && c !== s.color);
          rematch.disabled = iWant;
          rematch.textContent = iWant ? 'Waiting for opponent…' : oppWants ? 'Accept rematch' : 'Rematch';
          onlineStatus.textContent = '';
          if (winner === s.color) sound(520, true);
        } else {
          onlineGameActions.hidden = true;
          rematch.disabled = false;
          rematch.textContent = 'Rematch';
          const socketOpen = socketHealthy(s);
          const opp = opponentOf(s);
          const oppGone = !opp || opp.connected === false;
          if (!socketOpen) onlineStatus.textContent = 'Reconnecting…';
          else if (st.turn === s.color) onlineStatus.innerHTML = '<span class="turn-you">Your move — tap enemy waters to fire</span>';
          else onlineStatus.innerHTML = '<span class="turn-them">' +
            (oppGone ? 'Opponent disconnected — waiting for them to return'
              : `${(opp && opp.name) || 'Opponent'} is aiming…`) + '</span>';
        }
      }
      function showLobby() {
        activeSession = null;
        onlinePanel.hidden = false;
        gameView.hidden = true;
        sessionListWrap.hidden = false;
        if (!mmSearching && !mmPendingCode) {
          onlineSetup.hidden = false;
          matchSearch.hidden = true;
        }
        renderLobby();
        refreshMatchStats();
      }
      function openSession(code) {
        const s = sessionByCode(code);
        if (!s || s.dropped) return;
        activeSession = s;
        s.attention = false;
        onlineSetup.hidden = true;
        matchSearch.hidden = true;
        sessionListWrap.hidden = true;
        gameView.hidden = false;
        renderGameView();
        renderLobby();
        if (!s.superseded && (!s.socket || (s.socket.readyState !== WebSocket.OPEN && s.socket.readyState !== WebSocket.CONNECTING))) {
          connectSession(s);
        }
      }
      function switchMode(next) {
        mode = next;
        const online = next === 'online';
        tabCpu.classList.toggle('active', !online);
        tabOnline.classList.toggle('active', online);
        tabCpu.setAttribute('aria-selected', String(!online));
        tabOnline.setAttribute('aria-selected', String(online));
        cpuPanel.hidden = online;
        if (online) {
          setOnlineBusy(false);
          showLobby();
        } else {
          onlinePanel.hidden = true;
        }
      }

      // ---------- ONLINE: create / join ----------
      async function createOnlineGame() {
        const name = validName();
        if (!name) return;
        onlineError.textContent = '';
        setOnlineBusy(true);
        let room = null;
        let selectedBase = null;
        let lastFailure = 'network';
        for (const apiBase of ['', FALLBACK_API_BASE]) {
          const endpoint = apiBase ? `${apiBase}/api/battleship/rooms` : '/api/battleship/rooms';
          let response;
          try {
            response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name }),
            });
          } catch (_) {
            lastFailure = 'network';
            continue;
          }
          lastFailure = 'server';
          if (!response.ok) continue;
          let candidate;
          try { candidate = await response.json(); } catch (_) { continue; }
          if (cleanCode(candidate.code || '').length !== 6 || !candidate.token) continue;
          room = candidate;
          selectedBase = apiBase;
          break;
        }
        try {
          if (!room) {
            onlineError.textContent = lastFailure === 'server'
              ? 'Could not create a game. Please try again.'
              : 'Could not reach the game server. Check your connection and try again.';
            return;
          }
          const s = makeSession({ code: room.code, token: room.token, name, color: room.color || 1, apiBase: selectedBase });
          sessions.unshift(s);
          persistSessions();
          openSession(s.code);
        } finally {
          setOnlineBusy(false);
        }
      }
      function joinOnlineGame() {
        const name = validName();
        if (!name) return;
        const code = cleanCode(joinCode.value);
        joinCode.value = code;
        if (code.length !== 6) {
          onlineError.textContent = 'Enter the six-character invite code.';
          joinCode.focus();
          return;
        }
        const existing = sessionByCode(code);
        if (existing) {
          openSession(code);
          return;
        }
        const s = makeSession({ code, token: '', name, color: 0, apiBase: null });
        sessions.unshift(s);
        persistSessions();
        onlineError.textContent = '';
        setOnlineBusy(true);
        openSession(code);
      }
      async function roomAlive(s) {
        const base = s.apiBase || '';
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 6000);
          const response = await fetch(`${base}/api/battleship/rooms/${encodeURIComponent(s.code)}`, { signal: controller.signal });
          clearTimeout(timer);
          return response.status !== 404;
        } catch (_) {
          return true;
        }
      }
      async function restoreAllSessions() {
        const results = await Promise.all(sessions.slice().map(async s => ({ s, alive: await roomAlive(s) })));
        let ended = 0;
        for (const { s, alive } of results) {
          if (!alive) { dropSession(s); ended++; continue; }
          connectSession(s);
        }
        if (ended > 0) showLobbyNote(ended === 1 ? 'One of your saved games has ended.' : `${ended} of your saved games have ended.`);
      }

      // ---------- ONLINE: public matchmaking ----------
      function matchPlayerId() {
        let id = null;
        try { id = storeGet(MATCH_PLAYER_KEY); } catch (_) {}
        if (!id) {
          id = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : 'm-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
          try { storeSet(MATCH_PLAYER_KEY, id); } catch (_) {}
        }
        return id;
      }
      function mmSocketBase() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        return `${protocol}//${location.host}`;
      }
      function closeMmSocket() {
        const ws = mmSocket;
        mmSocket = null;
        clearInterval(mmKeepalive);
        mmKeepalive = 0;
        if (ws) { try { ws.close(); } catch (_) {} }
      }
      function setSearchingUI(searching, text) {
        onlineSetup.hidden = searching;
        matchSearch.hidden = !searching;
        if (typeof text === 'string') matchSearchText.textContent = text;
      }
      function stopSearching(note) {
        mmSearching = false;
        mmPendingCode = '';
        closeMmSocket();
        setSearchingUI(false);
        setOnlineBusy(false);
        if (note) showLobbyNote(note);
        refreshMatchStats();
      }
      function findPublicMatch() {
        const name = validName();
        if (!name) return;
        if (mmSearching) return;
        mmName = name;
        mmSearching = true;
        mmPendingCode = '';
        onlineError.textContent = '';
        setOnlineBusy(true);
        setSearchingUI(true, 'Searching for opponent…');
        openMmSocket();
      }
      function openMmSocket() {
        closeMmSocket();
        let ws;
        try {
          ws = new WebSocket(`${mmSocketBase()}/api/match/battleship/ws`);
        } catch (_) {
          stopSearching('Could not reach the matchmaker. Check your connection and try again.');
          return;
        }
        mmSocket = ws;
        ws.addEventListener('open', () => {
          if (mmSocket !== ws) return;
          try {
            ws.send(JSON.stringify({ t: 'hello', playerId: matchPlayerId(), name: mmName }));
            ws.send(JSON.stringify({ t: 'find', name: mmName }));
          } catch (_) {}
          clearInterval(mmKeepalive);
          mmKeepalive = setInterval(() => {
            if (mmSocket === ws && ws.readyState === WebSocket.OPEN) {
              try { ws.send(JSON.stringify({ t: 'ping' })); } catch (_) {}
            }
          }, 20000);
        });
        ws.addEventListener('message', event => {
          if (mmSocket !== ws) return;
          let m;
          try { m = JSON.parse(event.data); } catch (_) { return; }
          if (m.t === 'pong') {
            if (mmSearching && m.queued === false) {
              try { ws.send(JSON.stringify({ t: 'find', name: mmName })); } catch (_) {}
            } else if (mmPendingCode && !m.pendingMatch) {
              mmPendingCode = '';
              mmSearching = true;
              setSearchingUI(true, 'Searching for opponent…');
              try { ws.send(JSON.stringify({ t: 'find', name: mmName })); } catch (_) {}
            }
          } else if (m.t === 'queued') {
            const pos = Math.max(1, (m.position | 0) || 1);
            matchSearchText.textContent = pos > 1
              ? `Searching for opponent… (${pos} in line — pairing as soon as someone arrives)`
              : 'Searching for opponent…';
          } else if (m.t === 'matched' && m.code) {
            // Verify the match is really a Battleship room before joining.
            if (m.game !== 'battleship') {
              stopSearching('Matchmaking returned an incompatible game. Please try again.');
              return;
            }
            onMatched(cleanCode(m.code));
          } else if (m.t === 'matchFailed') {
            const reason = m.reason || 'Opponent never joined — searching again…';
            const failedCode = mmPendingCode;
            mmPendingCode = '';
            mmSearching = true;
            const dead = failedCode ? sessionByCode(failedCode) : null;
            if (dead) dropSession(dead);
            else showLobby();
            setSearchingUI(true, reason);
            showLobbyNote(reason);
          } else if (m.t === 'cancelled') {
            stopSearching();
          } else if (m.t === 'error') {
            stopSearching(m.msg || 'Matchmaking failed. Please try again.');
          }
        });
        ws.addEventListener('close', () => {
          if (mmSocket !== ws) return;
          mmSocket = null;
          clearInterval(mmKeepalive);
          mmKeepalive = 0;
          if (mmSearching && !mmPendingCode) {
            stopSearching('Connection lost. Tap "Find public match" to search again.');
          }
        });
      }
      function onMatched(code) {
        if (!code) { stopSearching('Matchmaking failed. Please try again.'); return; }
        mmSearching = false;
        mmPendingCode = code;
        showLobbyNote('Opponent found! Joining…');
        setOnlineBusy(false);
        const existing = sessionByCode(code);
        if (existing) { openSession(code); return; }
        const s = makeSession({ code, token: '', name: mmName, color: 0, apiBase: null });
        sessions.unshift(s);
        persistSessions();
        openSession(code);
      }
      function cancelPublicMatch() {
        const ws = mmSocket;
        if (ws && ws.readyState === WebSocket.OPEN) {
          try { ws.send(JSON.stringify({ t: 'cancel' })); } catch (_) {}
        }
        stopSearching();
      }
      async function refreshMatchStats() {
        if (mode !== 'online' || onlineSetup.hidden) return;
        try {
          const base = location.host === '1v1.nz' ? 'https://1v1.nz' : '';
          const res = await fetch(`${base}/api/match/battleship/stats`);
          if (!res.ok) return;
          const n = (await res.json()).searching | 0;
          matchStats.textContent = n > 0 ? `${n} player${n === 1 ? '' : 's'} searching right now` : '';
        } catch (_) {}
      }

      // ---------- ONLINE: wiring ----------
      tabCpu.addEventListener('click', () => switchMode('cpu'));
      tabOnline.addEventListener('click', () => switchMode('online'));
      createGame.addEventListener('click', createOnlineGame);
      findMatch.addEventListener('click', findPublicMatch);
      cancelMatch.addEventListener('click', cancelPublicMatch);
      onlineForm.addEventListener('submit', event => { event.preventDefault(); joinOnlineGame(); });
      joinCode.addEventListener('input', () => { joinCode.value = cleanCode(joinCode.value); });
      backToLobby.addEventListener('click', showLobby);
      newOnlineGame.addEventListener('click', showLobby);
      shareInvite.addEventListener('click', () => shareInviteLink(activeSession, shareInvite));
      copyGameLink.addEventListener('click', () => shareInviteLink(activeSession, copyGameLink));
      shareBtn.addEventListener('click', () => shareInviteLink(activeSession, shareBtn));
      retryLobbyConnection.addEventListener('click', retryActiveSession);
      retryGameConnection.addEventListener('click', retryActiveSession);
      takeoverButton.addEventListener('click', takeoverSession);
      leaveOnline.addEventListener('click', () => { if (activeSession) leaveSession(activeSession); });
      leaveGameButton.addEventListener('click', () => { if (activeSession) leaveSession(activeSession); });
      resignButton.addEventListener('click', async () => {
        const s = activeSession;
        if (!s || !s.state || s.state.status !== 'playing' || s.resignInFlight) return;
        if (await showConfirm('Resign this game?', 'Resign')) {
          if (socketHealthy(s)) {
            sendResignMsg(s);
          } else {
            s.pendingResign = true;
            reconnectNow();
            onlineStatus.textContent = 'Reconnecting…';
          }
        }
      });
      rematch.addEventListener('click', () => {
        const s = activeSession;
        if (!s) return;
        if (socketHealthy(s)) {
          sendRematchMsg(s);
        } else {
          s.pendingRematch = true;
          reconnectNow();
        }
        rematch.disabled = true;
        rematch.textContent = 'Waiting for opponent…';
      });
      ghSeries.addEventListener('click', async () => {
        const s = activeSession;
        if (!s) return;
        if (await showConfirm(`Reset your series score against ${opponentName(s)}?`, 'Reset')) {
          s.series = { w: 0, l: 0 };
          persistSessions();
          renderGameView();
          renderLobby();
        }
      });
      confirmCancel.addEventListener('click', () => closeConfirm(false));
      confirmOk.addEventListener('click', () => closeConfirm(true));
      confirmOverlay.addEventListener('click', event => { if (event.target === confirmOverlay) closeConfirm(false); });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reconnectNow();
      });
      addEventListener('pageshow', () => reconnectNow());
      addEventListener('online', () => reconnectNow());

      // ---------- boot ----------
      loadStoredSessions();
      try {
        const savedName = storeGet(NAME_KEY);
        if (savedName) displayName.value = savedName;
      } catch (_) {}
      const sharedCode = cleanCode(new URLSearchParams(location.search).get('code') || '');
      if (sharedCode.length === 6) {
        switchMode('online');
        const existing = sessionByCode(sharedCode);
        if (existing) {
          showLobbyNote('Welcome back — reconnecting to your game…');
          openSession(sharedCode);
          restoreAllSessions();
        } else {
          joinCode.value = sharedCode;
          joinGame.textContent = `Join ${sharedCode}`;
          displayName.focus();
        }
      } else {
        restoreAllSessions();
      }
    })();
  </script>
</body>
</html>
