<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#07152c" />
  <link rel="icon" href="data:," />
  <title>Connect 4 Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Paytone+One&display=swap');

    :root {
      color-scheme: light dark;
      --ink: #12203a;
      --muted: #60708b;
      --paper: #f3f6fb;
      --panel: rgba(255,255,255,.86);
      --line: rgba(33,63,110,.14);
      --board: #1468df;
      --board-hi: #2e86f4;
      --hole: #e7edf7;
      --red: #f04455;
      --red-hi: #ff7682;
      --gold: #ffbf2f;
      --gold-hi: #ffe070;
      --shadow: 0 24px 70px rgba(31,73,142,.23), 0 6px 18px rgba(15,44,92,.16);
      --button: #102c5b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #edf5ff;
        --muted: #95a8c4;
        --paper: #061226;
        --panel: rgba(8,25,51,.84);
        --line: rgba(169,201,255,.16);
        --board: #1168e6;
        --board-hi: #2f8bff;
        --hole: #07172f;
        --shadow: 0 28px 80px rgba(0,0,0,.46), 0 7px 20px rgba(0,0,0,.35);
        --button: #d9e8ff;
      }
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; }
    [hidden] { display: none !important; }
    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .shell {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(22px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    }
    .game {
      width: min(100%, 680px);
      display: grid;
      gap: 18px;
    }
    .topline {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      max-width: 390px;
      font-family: "Paytone One", sans-serif;
      font-weight: 400;
      font-size: clamp(32px, 6vw, 54px);
      line-height: .98;
      letter-spacing: -.025em;
    }
    h1 span { color: var(--board); }
    .controls {
      display: grid;
      gap: 7px;
      justify-items: end;
      flex: 0 0 auto;
    }
    .mode, .difficulty {
      display: inline-grid;
      padding: 4px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(21,55,100,.09);
    }
    .mode { grid-template-columns: repeat(3, 1fr); }
    .difficulty { grid-template-columns: repeat(3, 1fr); }
    .mode button, .difficulty button {
      min-height: 36px;
      padding: 7px 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    .difficulty button { min-height: 31px; padding: 5px 10px; font-size: 11px; }
    .mode button.active, .difficulty button.active {
      background: var(--ink);
      color: var(--paper);
    }
    .mode button:focus-visible, .difficulty button:focus-visible, .new-round:focus-visible {
      outline: 3px solid var(--board-hi);
      outline-offset: 2px;
    }
    .online-panel {
      display: grid;
      gap: 16px;
      padding: clamp(18px, 4vw, 28px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 16px 44px rgba(26,62,111,.13);
      backdrop-filter: blur(15px);
    }
    .online-panel h2, .online-panel p { margin: 0; }
    .online-panel h2 { font-family: "Paytone One", sans-serif; font-size: clamp(23px, 4vw, 31px); font-weight: 400; }
    .online-panel p { color: var(--muted); line-height: 1.5; }
    .online-form { display: grid; gap: 12px; }
    .online-form label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .online-form input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--paper) 72%, transparent);
      color: var(--ink);
      padding: 10px 13px;
      font-size: 16px;
      outline: none;
    }
    .online-form input:focus { border-color: var(--board-hi); box-shadow: 0 0 0 3px color-mix(in srgb, var(--board-hi) 22%, transparent); }
    .online-form input.code-input { letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }
    .online-actions, .game-over-actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .online-button {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      padding: 10px 15px;
      background: var(--button);
      color: var(--paper);
      font-weight: 700;
      cursor: pointer;
    }
    .online-button.secondary { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); border: 1px solid var(--line); }
    .online-button:disabled { opacity: .5; cursor: not-allowed; }
    .online-button:focus-visible, .online-form input:focus-visible { outline: 3px solid var(--board-hi); outline-offset: 2px; }
    .online-error { min-height: 20px; color: var(--red) !important; font-size: 13px; font-weight: 700; }
    .confirm-overlay {
      position: fixed; inset: 0; z-index: 90;
      display: flex; align-items: center; justify-content: center;
      padding: 22px;
      background: rgba(8, 18, 38, .55);
      backdrop-filter: blur(4px);
    }
    .confirm-overlay[hidden] { display: none; }
    .confirm-dialog {
      width: min(340px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(10, 30, 70, .35);
      display: grid; gap: 16px;
    }
    .confirm-title { margin: 0; font-weight: 700; font-size: 16px; line-height: 1.45; color: var(--ink); }
    .confirm-actions { display: flex; gap: 10px; }
    .confirm-actions .online-button { flex: 1; }
    .online-button.danger { background: var(--red); color: #fff; }
    .invite-block { text-align: center; padding: 6px 0 2px; }
    .invite-code { margin: 4px 0 8px; font-family: "Paytone One", sans-serif; font-size: clamp(38px, 10vw, 68px); letter-spacing: .12em; line-height: 1; color: var(--board); }
    .waiting-line { display: inline-flex; align-items: center; gap: 9px; color: var(--ink) !important; font-weight: 700; }
    .waiting-line::before, .connection-indicator::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 22%, transparent); }
    .connection-recovery { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .connection-indicator { display: inline-flex; align-items: center; gap: 8px; margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; }
    .connection-indicator::before { background: var(--board-hi); box-shadow: 0 0 0 4px color-mix(in srgb, var(--board-hi) 18%, transparent); animation: reconnectPulse 1s ease-in-out infinite alternate; }
    @keyframes reconnectPulse { to { opacity: .35; } }
    .scorebar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(26,62,111,.10);
      backdrop-filter: blur(15px);
    }
    .player {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 8px;
      border-radius: 12px;
      opacity: .54;
      transition: opacity .2s, background .2s;
    }
    .player:last-child { justify-content: flex-end; text-align: right; }
    .player.active { opacity: 1; background: color-mix(in srgb, var(--ink) 6%, transparent); }
    .chip {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border-radius: 50%;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.35);
    }
    .chip.red { background: var(--red); }
    .chip.gold { background: var(--gold); }
    .who { overflow: hidden; }
    .who strong, .who small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who strong { font-size: 14px; }
    .who small { color: var(--muted); font-size: 11px; }
    .points {
      min-width: 54px;
      text-align: center;
      font-family: "Paytone One", sans-serif;
      font-size: 24px;
      line-height: 1;
    }
    .points small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font: 600 9px/1 "DM Sans", sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .arena {
      position: relative;
      isolation: isolate;
    }
    .column-markers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(4px, 1.1vw, 10px);
      padding: 0 clamp(13px, 3vw, 24px) 7px;
    }
    .column-marker {
      display: grid;
      place-items: center;
      height: 24px;
      opacity: 0;
      transform: translateY(5px);
      transition: .14s ease;
      pointer-events: none;
    }
    .column-marker::before {
      content: "";
      width: clamp(14px, 3.3vw, 23px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--turn-color, var(--red));
      box-shadow: inset 0 -3px 0 rgba(0,0,0,.15);
    }
    .arena[data-hover] .column-marker.hover { opacity: .8; transform: none; }
    .board-wrap {
      position: relative;
      padding: clamp(13px, 3vw, 24px);
      border-radius: clamp(20px, 4vw, 34px);
      background: linear-gradient(155deg, var(--board-hi), var(--board) 46%, #084cae);
      box-shadow: var(--shadow), inset 0 2px 1px rgba(255,255,255,.38), inset 0 -7px 0 rgba(3,42,102,.45);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(4px, 1.1vw, 10px);
    }
    .cell {
      position: relative;
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--hole);
      box-shadow: inset 0 6px 11px rgba(2,33,80,.36), 0 2px 0 rgba(255,255,255,.24);
      cursor: pointer;
      overflow: hidden;
    }
    .cell:focus-visible { outline: 4px solid #fff; outline-offset: -1px; }
    .disc {
      position: absolute;
      inset: 4%;
      border-radius: 50%;
      transform: translateY(-760%);
      box-shadow: inset 0 -8px 0 rgba(0,0,0,.14), inset 0 6px 0 rgba(255,255,255,.27), 0 4px 8px rgba(0,0,0,.2);
    }
    .cell.red .disc { background: radial-gradient(circle at 35% 27%, var(--red-hi), var(--red) 57%); }
    .cell.gold .disc { background: radial-gradient(circle at 35% 27%, var(--gold-hi), var(--gold) 57%); }
    .cell.filled .disc { transform: translateY(0); }
    .cell.drop .disc { animation: drop .44s cubic-bezier(.2,.9,.35,1.12); }
    @keyframes drop {
      0% { transform: translateY(calc(-100% * var(--drop, 6))); }
      72% { transform: translateY(8%); }
      88% { transform: translateY(-4%); }
      100% { transform: translateY(0); }
    }
    .cell.winner .disc { animation: winPulse .75s ease-in-out infinite alternate; }
    @keyframes winPulse { to { transform: scale(.82); filter: brightness(1.14); box-shadow: 0 0 0 7px rgba(255,255,255,.8), 0 0 24px rgba(255,255,255,.5); } }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 46px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-weight: 700;
    }
    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--red);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--red) 20%, transparent);
    }
    .status.gold .status-dot { background: var(--gold); box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 22%, transparent); }
    .new-round {
      border: 0;
      border-radius: 13px;
      background: var(--button);
      color: var(--paper);
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(11,38,78,.22);
    }
    .new-round:active { transform: translateY(1px); }
    .status-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .music-control {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px 7px 4px 4px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 6px 18px rgba(21,55,100,.09);
    }
    .music-button {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      padding: 0;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    .music-button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
    .music-button:active { transform: translateY(1px); }
    .music-button svg { width: 17px; height: 17px; fill: currentColor; }
    .music-button .pause-icon { display: none; }
    .music-button.is-playing .play-icon { display: none; }
    .music-button.is-playing .pause-icon { display: block; }
    .music-button .muted-icon { display: none; }
    .music-button.is-muted .sound-icon { display: none; }
    .music-button.is-muted .muted-icon { display: block; }
    .music-volume {
      display: grid;
      place-items: center;
      width: 66px;
      height: 31px;
    }
    .music-volume input {
      width: 62px;
      margin: 0;
      accent-color: var(--board);
      cursor: pointer;
    }
    .music-button:focus-visible, .music-volume input:focus-visible {
      outline: 3px solid var(--board-hi);
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .hint { margin: -8px 0 0; text-align: center; color: var(--muted); font-size: 12px; }

    @media (max-width: 560px) {
      .shell { place-items: start center; padding-left: 12px; padding-right: 12px; }
      .game { gap: 13px; }
      .topline { align-items: center; flex-wrap: wrap; }
      h1 { font-size: clamp(29px, 9vw, 41px); }
      .controls { width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; }
      .mode { width: 100%; }
      .mode button { padding-inline: 8px; font-size: 11px; }
      .online-panel { border-radius: 19px; padding: 18px 16px; }
      .online-actions > * { flex: 1 1 140px; }
      .difficulty button { padding-inline: 8px; }
      .scorebar { padding: 8px; }
      .player { gap: 6px; padding-inline: 5px; }
      .chip { width: 22px; height: 22px; }
      .who strong { font-size: 12px; }
      .who small { display: none; }
      .points { min-width: 44px; font-size: 20px; }
      .column-markers { height: 20px; padding-bottom: 3px; }
      .column-marker { height: 17px; }
      .status-row { padding-inline: 4px; flex-wrap: wrap; }
      .status-tools { width: 100%; justify-content: space-between; }
      .hint { display: none; }
    }
    @media (max-width: 360px) {
      .shell { padding-inline: 8px; }
      .mode, .difficulty { border-radius: 11px; padding: 3px; }
      .mode button { min-height: 32px; border-radius: 8px; padding-inline: 7px; }
      .difficulty button { min-height: 30px; border-radius: 8px; padding-inline: 6px; }
      .board-wrap { padding: 11px; border-radius: 19px; }
      .board { gap: 4px; }
      .column-markers { padding-inline: 11px; gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      #sky { display: none; }
    }
    /* Online lobby: multi-game sessions, game header, chat */
    .lobby-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .session-list { display: grid; gap: 10px; }
    .lobby-empty { color: var(--muted); font-size: 14px; }
    .session-entry { display: flex; gap: 8px; align-items: stretch; }
    .session-open {
      position: relative; flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px;
      background: color-mix(in srgb, var(--paper) 72%, transparent); color: var(--ink);
      cursor: pointer; text-align: left;
    }
    .session-open:hover { border-color: var(--board-hi); }
    .session-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .session-name { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-code { font-size: 11px; color: var(--muted); letter-spacing: .14em; font-weight: 700; }
    .session-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .session-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 9%, transparent); white-space: nowrap; }
    .session-badge.yours { background: var(--red); color: #fff; }
    .session-badge.theirs { background: color-mix(in srgb, var(--gold) 34%, transparent); }
    .session-badge.warn { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
    .session-badge.muted { opacity: .72; }
    .session-series { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
    .session-entry.has-attention .session-open { border-color: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 18%, transparent); }
    .session-dot { position: absolute; top: 9px; right: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px color-mix(in srgb, var(--red) 22%, transparent); }
    .session-unread { font-size: 11px; font-weight: 700; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--board); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
    .session-leave { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 12px; min-width: 44px; cursor: pointer; font-size: 15px; }
    .session-leave:hover { color: var(--red); border-color: var(--red); }
    .online-note { min-height: 20px; color: var(--muted) !important; font-size: 13px; font-weight: 600; }

    .game-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; }
    .gh-info { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
    .gh-info strong { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }
    .gh-series { border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; padding: 3px 8px; border-radius: 8px; }
    .gh-series:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
    .gh-actions { display: flex; gap: 8px; align-items: center; }
    .gh-button { position: relative; min-height: 38px; padding: 7px 12px; border-radius: 11px; border: 1px solid var(--line); background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); font-weight: 700; font-size: 13px; cursor: pointer; }
    .gh-button .dot { position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
    .gh-button.gh-danger { color: var(--red); }

    .waiting-card { text-align: center; padding: 26px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; margin-bottom: 12px; }
    .waiting-card > p { color: var(--muted); margin: 0; }

    .chat-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-height: 64vh;
      display: flex; flex-direction: column; background: var(--panel);
      border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
      box-shadow: 0 -18px 50px rgba(10,30,70,.25);
      padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    }
    .chat-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .chat-head strong { font-size: 15px; }
    .chat-history { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; min-height: 110px; }
    .chat-msg { max-width: 84%; align-self: flex-start; background: color-mix(in srgb, var(--ink) 8%, transparent); border-radius: 4px 14px 14px 14px; padding: 8px 11px; }
    .chat-msg.mine { align-self: flex-end; background: var(--board); color: #fff; border-radius: 14px 4px 14px 14px; }
    .chat-meta { font-size: 11px; font-weight: 700; opacity: .7; margin-bottom: 3px; }
    .chat-text { font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
    .voice-bubble { display: inline-flex; align-items: center; gap: 9px; border: 0; background: transparent; color: inherit; font-weight: 700; font-size: 14px; cursor: pointer; padding: 5px 2px; }
    .voice-icon { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 12%, transparent); font-size: 12px; }
    .chat-msg.mine .voice-icon { background: rgba(255,255,255,.25); }

<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <main class="shell">

            </label>

            </label>

      </section>

      <div class="game-header" id="gameHeader" hidden>

              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.4v13.2c0 .8.9 1.3 1.6.8l9.5-6.6a1 1 0 0 0 0-1.6L9.6 4.6A1 1 0 0 0 8 5.4Z"/></svg>
              <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V5Zm6 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V5Z"/></svg>
            </button>
            <button type="button" class="music-button" id="musicNext" aria-label="Next StarMuff track" title="Next track">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.8v12.4c0 .8.9 1.3 1.6.8l8.9-6.2a1 1 0 0 0 0-1.6L6.6 5A1 1 0 0 0 5 5.8ZM17 5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V5Z"/></svg>

      <div class="chat-panel" id="chatPanel" hidden aria-label="Game chat">

        <p class="connection-indicator" id="connectionIndicator" aria-live="polite">Reconnecting…</p>
        <button class="online-button" type="button" id="retryGameConnection" hidden>Retry connection</button>

  <div class="confirm-overlay" id="confirmOverlay" hidden>

  <script>
    (() => {
      const ROWS = 6, COLS = 7;
      const boardEl = document.getElementById('board');
      const arena = document.getElementById('arena');
      const markers = document.getElementById('markers');
      const status = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const redPlayer = document.getElementById('redPlayer');
      const goldPlayer = document.getElementById('goldPlayer');
      const redName = document.getElementById('redName');
      const goldName = document.getElementById('goldName');
      const scoreText = document.getElementById('scoreText');
      const scorebar = document.getElementById('scorebar');
      const newRound = document.getElementById('newRound');
      const gameHint = document.getElementById('gameHint');
      const twoPlayer = document.getElementById('twoPlayer');
      const vsCpu = document.getElementById('vsCpu');
      const playOnline = document.getElementById('playOnline');
      const onlinePanel = document.getElementById('onlinePanel');
      const onlineSetup = document.getElementById('onlineSetup');
      const onlineForm = document.getElementById('onlineForm');
      const displayName = document.getElementById('displayName');
      const joinCode = document.getElementById('joinCode');
      const createGame = document.getElementById('createGame');
      const joinGame = document.getElementById('joinGame');
      const onlineError = document.getElementById('onlineError');
      const lobbyNewGame = document.getElementById('lobbyNewGame');
      const sessionList = document.getElementById('sessionList');
      const lobbyNote = document.getElementById('lobbyNote');
      const gameHeader = document.getElementById('gameHeader');
      const backToLobby = document.getElementById('backToLobby');
      const ghOpponent = document.getElementById('ghOpponent');
      const ghSeries = document.getElementById('ghSeries');
      const chatToggle = document.getElementById('chatToggle');
      const chatDot = document.getElementById('chatDot');
      const resignButton = document.getElementById('resignButton');
      const leaveGameButton = document.getElementById('leaveGameButton');
      const waitingCard = document.getElementById('waitingCard');
      const inviteCode = document.getElementById('inviteCode');
      const lobbyStatus = document.getElementById('lobbyStatus');
      const lobbyError = document.getElementById('lobbyError');
      const shareInvite = document.getElementById('shareInvite');
      const retryLobbyConnection = document.getElementById('retryLobbyConnection');
      const leaveOnline = document.getElementById('leaveOnline');
      const connectionRecovery = document.getElementById('connectionRecovery');
      const connectionIndicator = document.getElementById('connectionIndicator');
      const retryGameConnection = document.getElementById('retryGameConnection');
      const takeoverButton = document.getElementById('takeoverButton');
      const chatPanel = document.getElementById('chatPanel');
      const chatTitle = document.getElementById('chatTitle');
      const chatHistory = document.getElementById('chatHistory');
      const chatForm = document.getElementById('chatForm');
      const chatInput = document.getElementById('chatInput');
      const micButton = document.getElementById('micButton');
      const chatRec = document.getElementById('chatRec');
      const chatRecTime = document.getElementById('chatRecTime');
      const chatRecStop = document.getElementById('chatRecStop');
      const chatClose = document.getElementById('chatClose');
      const onlineGameActions = document.getElementById('onlineGameActions');
      const rematch = document.getElementById('rematch');
      const copyGameLink = document.getElementById('copyGameLink');
      const confirmOverlay = document.getElementById('confirmOverlay');
      const confirmTitle = document.getElementById('confirmTitle');
      const confirmOk = document.getElementById('confirmOk');
      const confirmCancel = document.getElementById('confirmCancel');
      const difficultyControl = document.getElementById('difficultyControl');
      const difficultyButtons = [...difficultyControl.querySelectorAll('button')];
      const musicToggle = document.getElementById('musicToggle');
      const musicNext = document.getElementById('musicNext');
      const musicMute = document.getElementById('musicMute');
      const musicVolume = document.getElementById('musicVolume');
      const trackStatus = document.getElementById('trackStatus');
      let grid, turn, locked, ended, mode = 'cpu', difficulty = 'hard';
      let scores = [0,0], moveHistory = [], audio;
      const FALLBACK_API_BASE = 'https://1v1.nz';
      const ROOM_UNAVAILABLE_MESSAGE = 'Could not join that room. It may be full or no longer available.';
      const CONNECT_TIMEOUT_MS = 8000;
      const MESSAGE_WATCHDOG_MS = 45000;
      const MAX_CONNECT_FAILURES = 4;
      // (online session-system state is declared in the lobby engine block below)

      for (let c = 0; c < COLS; c++) {
        const m = document.createElement('span');
        m.className = 'column-marker';
        markers.appendChild(m);
      }
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.setAttribute('role', 'gridcell');
        cell.setAttribute('aria-label', `Row ${r + 1}, column ${c + 1}, empty`);
        cell.innerHTML = '<span class="disc"></span>';
        cell.addEventListener('click', () => play(c));
        cell.addEventListener('mouseenter', () => showMarker(c));
        cell.addEventListener('focus', () => showMarker(c));
        boardEl.appendChild(cell);
      }
      boardEl.addEventListener('mouseleave', clearMarker);
      boardEl.addEventListener('keydown', e => {
        const current = document.activeElement;
        if (!current.classList.contains('cell')) return;
        let col = +current.dataset.col;
        if (e.key === 'ArrowLeft') col = Math.max(0, col - 1);
        else if (e.key === 'ArrowRight') col = Math.min(COLS - 1, col + 1);
        else return;
        e.preventDefault();
        boardEl.querySelector(`[data-row="${current.dataset.row}"][data-col="${col}"]`).focus();
      });

      function reset() {
        grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        moveHistory = [];
        turn = 1; locked = false; ended = false;
        document.querySelectorAll('.cell').forEach(cell => {
          cell.className = 'cell';
          cell.setAttribute('aria-label', `Row ${+cell.dataset.row + 1}, column ${+cell.dataset.col + 1}, empty`);
        });
        setStatus();
        clearMarker();
      }
      function setStatus(message) {
        redPlayer.classList.toggle('active', turn === 1 && !ended);
        goldPlayer.classList.toggle('active', turn === 2 && !ended);
        status.classList.toggle('gold', turn === 2);
        arena.style.setProperty('--turn-color', turn === 1 ? 'var(--red)' : 'var(--gold)');
        if (message) statusText.textContent = message;
        else if (mode === 'cpu') statusText.textContent = turn === 1 ? 'Your move' : 'CPU is thinking…';
        else statusText.textContent = turn === 1 ? 'Red to move' : 'Gold to move';
      }
      function showMarker(col) {
        if (locked || ended || grid[0][col]) return clearMarker();
        if (mode === 'online') {
          const s = activeSession;
          if (!s || !s.state || s.state.status !== 'playing' || s.state.turn !== s.color || !socketHealthy(s)) return clearMarker();
        }
        arena.dataset.hover = col;
        markers.children[col].classList.add('hover');
      }
      function clearMarker() {
        delete arena.dataset.hover;
        [...markers.children].forEach(m => m.classList.remove('hover'));
      }
      function play(col) {
        if (mode === 'online') {
          const s = activeSession;
          // Tapping your column while the connection is down reconnects first
          // and queues the move instead of silently swallowing the tap.
          if (s && s.state && s.state.status === 'playing' && s.state.turn === s.color && !grid[0][col] && !s.moveInFlight && !socketHealthy(s)) {
            s.pendingMove = col;
            reconnectNow();
            statusText.textContent = 'Reconnecting…';
            return;
          }
        }
        if (locked || ended || grid[0][col]) return;
        if (mode === 'online') {
          const s = activeSession;
          if (!s || !s.state || s.state.status !== 'playing' || s.state.turn !== s.color || s.moveInFlight || !socketHealthy(s)) return;
          s.moveInFlight = true;
          s.socket.send(JSON.stringify({t: 'move', col}));
          clearMarker();
          return;
        }
        if (mode === 'cpu' && turn === 2) return;
        drop(col);
      }
      function drop(col) {
        let row = ROWS - 1;
        while (row >= 0 && grid[row][col]) row--;
        if (row < 0) return false;
        grid[row][col] = turn;
        moveHistory.push(col);
        const cell = boardEl.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        cell.classList.add(turn === 1 ? 'red' : 'gold', 'filled', 'drop');
        cell.style.setProperty('--drop', row + 1);
        cell.setAttribute('aria-label', `Row ${row + 1}, column ${col + 1}, ${turn === 1 ? 'red' : 'gold'} disc`);
        sound(turn === 1 ? 240 : 320);
        burstAt(cell, turn === 1 ? '#f04455' : '#ffbf2f', 8);
        const win = winningLine(row, col, turn);
        if (win) {
          ended = true; locked = true;
          win.forEach(([r,c]) => boardEl.querySelector(`[data-row="${r}"][data-col="${c}"]`).classList.add('winner'));
          scores[turn - 1]++;
          scoreText.textContent = `${scores[0]}—${scores[1]}`;
          const name = mode === 'cpu' ? (turn === 1 ? 'You win!' : 'CPU wins') : (turn === 1 ? 'Red wins!' : 'Gold wins!');
          setStatus(name);
          celebrate(turn === 1 ? '#f04455' : '#ffbf2f');
          sound(520, true);
          clearMarker();
          return true;
        }
        if (grid[0].every(Boolean)) {
          ended = true; locked = true; setStatus('A perfect draw'); clearMarker(); return true;
        }
        turn = turn === 1 ? 2 : 1;
        setStatus(); clearMarker();
        if (mode === 'cpu' && turn === 2) {
          locked = true;
          setTimeout(() => { locked = false; if (!ended) drop(cpuMove()); }, 520);
        }
        return true;
      }
      function winningLine(row, col, player, testGrid = grid) {
        const directions = [[1,0],[0,1],[1,1],[1,-1]];
        for (const [dr,dc] of directions) {
          const line = [[row,col]];
          for (const sign of [-1,1]) {
            let r = row + dr*sign, c = col + dc*sign;
            while (r>=0&&r<ROWS&&c>=0&&c<COLS&&testGrid[r][c]===player) {
              sign < 0 ? line.unshift([r,c]) : line.push([r,c]); r += dr*sign; c += dc*sign;
            }
          }
          if (line.length >= 4) return line;
        }
        return null;
      }
      function validMoves() {
        return [3,2,4,1,5,0,6].filter(c => !grid[0][c]);
      }
      function playableRow(col) {
        let row = ROWS - 1;
        while (row >= 0 && grid[row][col]) row--;
        return row;
      }
      function tacticalMove(player) {
        for (const col of validMoves()) {
          const row = playableRow(col);
          grid[row][col] = player;
          const wins = Boolean(winningLine(row, col, player));
          grid[row][col] = 0;
          if (wins) return col;
        }
      }
      function evaluateWindow(cells) {
        let cpu = 0, human = 0, empty = 0;
        for (const value of cells) {
          if (value === 2) cpu++;
          else if (value === 1) human++;
          else empty++;
        }
        if (cpu === 4) return 100000;
        if (human === 4) return -100000;
        let score = 0;
        if (cpu === 3 && empty === 1) score += 140;
        else if (cpu === 2 && empty === 2) score += 18;
        if (human === 3 && empty === 1) score -= 175;
        else if (human === 2 && empty === 2) score -= 22;
        return score;
      }
      function evaluatePosition() {
        let score = 0;
        for (let r = 0; r < ROWS; r++) score += grid[r][3] === 2 ? 9 : grid[r][3] === 1 ? -9 : 0;
        for (let r = 0; r < ROWS; r++) for (let c = 0; c <= COLS - 4; c++)
          score += evaluateWindow([grid[r][c],grid[r][c+1],grid[r][c+2],grid[r][c+3]]);
        for (let c = 0; c < COLS; c++) for (let r = 0; r <= ROWS - 4; r++)
          score += evaluateWindow([grid[r][c],grid[r+1][c],grid[r+2][c],grid[r+3][c]]);
        for (let r = 0; r <= ROWS - 4; r++) for (let c = 0; c <= COLS - 4; c++) {
          score += evaluateWindow([grid[r][c],grid[r+1][c+1],grid[r+2][c+2],grid[r+3][c+3]]);
          score += evaluateWindow([grid[r+3][c],grid[r+2][c+1],grid[r+1][c+2],grid[r][c+3]]);
        }
        return score;
      }
      function openingPreference() {
        if (moveHistory.length > 6) return null;
        if (!grid[0][3]) return 3;
        const first = moveHistory[0];
        return first === 3 ? (!grid[0][2] ? 2 : 4) : 3;
      }
      function orderedMoves(player, preferred = null) {
        const opponent = player === 2 ? 1 : 2;
        return validMoves().map(col => {
          const row = playableRow(col);
          let priority = 10 - Math.abs(3 - col) * 2;
          if (col === preferred) priority += 18;
          grid[row][col] = player;
          if (winningLine(row, col, player)) priority += 10000;
          grid[row][col] = opponent;
          if (winningLine(row, col, opponent)) priority += 800;
          grid[row][col] = 0;
          return {col, priority};
        }).sort((a,b) => b.priority - a.priority).map(item => item.col);
      }

      let searchDeadline = 0, searchNodes = 0, searchTimedOut = false, transpositions;
      function boardKey(maximizing) {
        let key = maximizing ? 'M' : 'm';
        for (let r = 0; r < ROWS; r++) key += grid[r].join('');
        return key;
      }
      function minimax(depth, alpha, beta, maximizing) {
        if (((++searchNodes) & 511) === 0 && performance.now() > searchDeadline) searchTimedOut = true;
        if (searchTimedOut || depth === 0 || grid[0].every(Boolean)) return evaluatePosition();

        const originalAlpha = alpha, originalBeta = beta;
        const key = boardKey(maximizing);

      function renderSessionState(s) {

      function renderOnlineBoard(nextBoard, winningCells = []) {
        const previous = grid ? grid.map(row => row.slice()) : Array.from({length: ROWS}, () => Array(COLS).fill(0));
        grid = nextBoard.map(row => row.slice());
        const winning = new Set(winningCells.map(([r,c]) => `${r},${c}`));
        let newest = null;
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
          const value = grid[r][c];
          const cell = boardEl.querySelector(`[data-row="${r}"][data-col="${c}"]`);
          cell.className = 'cell';
          cell.style.removeProperty('--drop');
          if (value) {

            cell.setAttribute('aria-label', `Row ${r + 1}, column ${c + 1}, ${value === 1 ? 'red' : 'gold'} disc`);
            if (!previous[r][c]) newest = {cell, value, row: r};
          } else {
            cell.setAttribute('aria-label', `Row ${r + 1}, column ${c + 1}, empty`);
          }
          if (winning.has(`${r},${c}`)) cell.classList.add('winner');

        if (newest) {
          newest.cell.classList.add('drop');
          newest.cell.style.setProperty('--drop', newest.row + 1);
          sound(newest.value === 1 ? 240 : 320);

        }

      // ----- create / join -----
      async function createOnlineGame() {
        const name = validName();
        if (!name) return;
        onlineError.textContent = '';
        setOnlineBusy(true);
        let room = null;
        let selectedBase = null;
        let lastFailure = 'network';
        for (const apiBase of ['', FALLBACK_API_BASE]) {
          const endpoint = apiBase ? `${apiBase}/api/rooms` : '/api/rooms';
          let response;
          try {
            response = await fetch(endpoint, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({name})
            });
          } catch (_) {
            lastFailure = 'network';
            continue;
          }
          lastFailure = 'server';
          if (!response.ok) continue;
          let candidate;
          try { candidate = await response.json(); } catch (_) { continue; }
          if (cleanCode(candidate.code || '').length !== 6 || !candidate.token) continue;
          room = candidate;
          selectedBase = apiBase;
          break;
        }
        try {
          if (!room) {
            onlineError.textContent = lastFailure === 'server'
              ? 'Could not create a game. Please try again.'
              : 'Could not reach the game server. Check your connection and try again.';
            return;
          }
          const s = makeSession({ code: room.code, token: room.token, name, color: room.color || 1, apiBase: selectedBase });
          sessions.unshift(s);
          persistSessions();
          openSession(s.code);
        } finally {
          setOnlineBusy(false);
        }

        if (existing) {

          return;
        }
        const s = makeSession({ code, token: '', name, color: 0, apiBase: null });
        sessions.unshift(s);

        onlineError.textContent = '';
        setOnlineBusy(true);
        openSession(code);
      }
      async function roomAlive(s) {
        const base = s.apiBase || '';

          const response = await fetch(`${base}/api/rooms/${encodeURIComponent(s.code)}`, { signal: controller.signal });
          clearTimeout(timer);
          return response.status !== 404;
        } catch (_) {
          return true;
        }
      }
      async function restoreAllSessions() {
        const results = await Promise.all(sessions.slice().map(async s => ({ s, alive: await roomAlive(s) })));
        let ended = 0;

          connectSession(s);

        if (ended > 0) showLobbyNote(ended === 1 ? 'One of your saved games has ended.' : `${ended} of your saved games have ended.`);
      }

      function chatBubble(m, s) {
        const mine = m.color !== 0 && m.color === s.color;
        const wrap = document.createElement('div');
        wrap.className = 'chat-msg' + (mine ? ' mine' : '');
        const meta = document.createElement('div');

        meta.textContent = (mine ? 'You' : (m.from || 'Opponent')) + (when ? ` · ${when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}` : '');
        wrap.appendChild(meta);
        if (m.kind === 'voice') {

          btn.type = 'button';

          btn.setAttribute('aria-label', `Play voice note, ${m.dur || 0} seconds`);

          icon.className = 'voice-icon';
          icon.textContent = '▶';
          const label = document.createElement('span');
          label.textContent = `Voice note · ${m.dur || 0}s`;
          btn.append(icon, label);
          let audioEl = null, playing = false;
          btn.addEventListener('click', () => {
            try {
              if (!audioEl) {
                audioEl = new Audio('data:audio/webm;base64,' + m.data);
                audioEl.addEventListener('play', () => { playing = true; icon.textContent = '⏸'; });
                const stopped = () => { playing = false; icon.textContent = '▶'; };
                audioEl.addEventListener('pause', stopped);
                audioEl.addEventListener('ended', stopped);
              }
              if (playing) audioEl.pause();
              else audioEl.play().catch(() => {});
            } catch (_) {}
          });
          wrap.appendChild(btn);
        } else {
          const body = document.createElement('div');
          body.className = 'chat-text';
          body.textContent = m.text;
          wrap.appendChild(body);
        }
        return wrap;
      }
      function queueOfflinePayload(s, key, value, max = 20) {
        (s[key] = s[key] || []).push(value);
        if (s[key].length > max) s[key].splice(0, s[key].length - max);
      }
      function sendChatMessage() {
        const s = chatOpenFor || activeSession;
        if (!s || s.dropped) return;
        const text = chatInput.value.trim().slice(0, 500);
        if (!text) return;
        chatInput.value = '';
        if (socketHealthy(s)) {
          try { s.socket.send(JSON.stringify({ t: 'chat', text })); }
          catch (_) { queueOfflinePayload(s, 'pendingChat', text); reconnectNow(); }
        } else {
          // Still show it instantly, but queue it so the opponent actually gets it.
          queueOfflinePayload(s, 'pendingChat', text);
          reconnectNow();
        }
        receiveChatMessage(s, { kind: 'text', from: s.name, color: s.color, text, ts: Date.now() });
      }

      // ----- voice notes (live relay only, never stored server-side) -----
      function cleanupVoiceStream() {
        if (voiceStream) { try { voiceStream.getTracks().forEach(t => t.stop()); } catch (_) {} voiceStream = null; }
      }
      async function toggleVoiceRecording() {
        if (voiceRecorder) { stopVoiceRecording(true); return; }
        const s = chatOpenFor || activeSession;
        if (!s || s.dropped) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
          chatRec.hidden = false;
          chatRecTime.textContent = 'voice notes are not supported in this browser';
          setTimeout(() => { chatRec.hidden = true; }, 2200);
          return;
        }
        try {
          voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (_) {
          chatRec.hidden = false;
          chatRecTime.textContent = 'microphone unavailable';
          setTimeout(() => { if (!voiceRecorder) chatRec.hidden = true; }, 2200);
          return;
        }
        const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
        voiceRecorder = mime ? new MediaRecorder(voiceStream, { mimeType: mime }) : new MediaRecorder(voiceStream);
        voiceChunks = [];
        voiceStart = Date.now();
        voiceSendIt = true;
        voiceRecorder.ondataavailable = event => { if (event.data && event.data.size) voiceChunks.push(event.data); };
        voiceRecorder.onstop = () => finishVoiceRecording(s);
        try { voiceRecorder.start(); } catch (_) { stopVoiceRecording(false); return; }
        chatRec.hidden = false;
        chatRecTime.textContent = '0';
        micButton.classList.add('recording');
        voiceTickTimer = setInterval(() => {
          chatRecTime.textContent = String(Math.min(VOICE_MAX_SECONDS, Math.round((Date.now() - voiceStart) / 1000)));
        }, 500);
        voiceCapTimer = setTimeout(() => stopVoiceRecording(true), VOICE_MAX_SECONDS * 1000);
      }
      function stopVoiceRecording(sendIt) {
        clearTimeout(voiceCapTimer);
        clearInterval(voiceTickTimer);
        voiceCapTimer = 0; voiceTickTimer = 0;
        micButton.classList.remove('recording');
        voiceSendIt = !!sendIt;
        const rec = voiceRecorder;
        voiceRecorder = null;
        if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch (_) { cleanupVoiceStream(); chatRec.hidden = true; } }
        else { cleanupVoiceStream(); chatRec.hidden = true; }
      }
      function finishVoiceRecording(s) {
        clearTimeout(voiceCapTimer);
        clearInterval(voiceTickTimer);
        voiceCapTimer = 0; voiceTickTimer = 0;
        micButton.classList.remove('recording');
        cleanupVoiceStream();
        chatRec.hidden = true;
        const sendIt = voiceSendIt;
        voiceSendIt = true;
        const chunks = voiceChunks;
        voiceChunks = [];
        if (!sendIt || !chunks.length || !s || s.dropped) return;
        const blob = new Blob(chunks, { type: 'audio/webm' });
        const dur = Math.max(1, Math.min(60, Math.round((Date.now() - voiceStart) / 1000)));
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const dataUrl = String(reader.result || '');
            const base64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
            if (!base64 || base64.length > 650000) return;
            const payload = { data: base64, dur };
            if (socketHealthy(s)) {
              try { s.socket.send(JSON.stringify({ t: 'voice', data: base64, dur })); }
              catch (_) { queueOfflinePayload(s, 'pendingVoice', payload, 5); reconnectNow(); }

              reconnectNow();
            }
            receiveChatMessage(s, { kind: 'voice', from: s.name, color: s.color, data: base64, dur, ts: Date.now() });
          } catch (_) {}
        };
        try { reader.readAsDataURL(blob); } catch (_) {}
      }

      musicAudio.addEventListener('play', updateMusicControls);
      musicAudio.addEventListener('pause', updateMusicControls);
      musicAudio.addEventListener('ended', () => selectTrack(trackIndex + 1, true));
      updateMusicControls();

      function sound(freq, win = false) {
        try {
          audio ||= new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === 'suspended') audio.resume();
          const now = audio.currentTime;
          const o = audio.createOscillator(), g = audio.createGain();
          o.type = 'sine'; o.frequency.setValueAtTime(freq, now);
          if (win) o.frequency.exponentialRampToValueAtTime(freq*1.7, now+.22);
          g.gain.setValueAtTime(.065, now); g.gain.exponentialRampToValueAtTime(.001, now+(win?.32:.12));
          o.connect(g).connect(audio.destination); o.start(); o.stop(now+(win?.34:.14));
        } catch (_) {}
      }

      // Reactive JavaScript background: drifting connection nodes + gameplay sparks.
      const canvas = document.getElementById('sky'), ctx = canvas.getContext('2d');
      let dots = [], sparks = [], w = 0, h = 0, dpr = 1, mouse = {x:-9999,y:-9999};
      function resize() {
        dpr = Math.min(2, devicePixelRatio || 1); w = innerWidth; h = innerHeight;
        canvas.width = w*dpr; canvas.height = h*dpr; canvas.style.width = w+'px'; canvas.style.height = h+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        const n = Math.max(20, Math.min(58, Math.round(w*h/22000)));
        dots = Array.from({length:n}, () => ({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()*2.4+1}));
      }
      function background() {
        ctx.clearRect(0,0,w,h);
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        const line = dark ? '115,168,240' : '50,112,196';
        for (let i=0;i<dots.length;i++) {
          const a=dots[i]; a.x+=a.vx; a.y+=a.vy;
          if(a.x<0||a.x>w)a.vx*=-1; if(a.y<0||a.y>h)a.vy*=-1;
          const md=Math.hypot(a.x-mouse.x,a.y-mouse.y); if(md<120){a.x+=(a.x-mouse.x)*.006;a.y+=(a.y-mouse.y)*.006;}
          for(let j=i+1;j<dots.length;j++){
            const b=dots[j], dist=Math.hypot(a.x-b.x,a.y-b.y);
            if(dist<120){ctx.beginPath();ctx.strokeStyle=`rgba(${line},${(1-dist/120)*.15})`;ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
          }
          ctx.beginPath();ctx.fillStyle=`rgba(${line},${dark?.32:.22})`;ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fill();
        }
        sparks = sparks.filter(s => s.life>0);
        sparks.forEach(s => {s.x+=s.vx;s.y+=s.vy;s.vy+=.04;s.life-=.018;ctx.globalAlpha=Math.max(0,s.life);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
        ctx.globalAlpha=1; requestAnimationFrame(background);
      }
      function burstAt(el, color, count) {
        const r=el.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
        for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2, v=Math.random()*1.7+.4;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*2.5+1,color,life:.8});}
      }
      function celebrate(color) {
        for(let i=0;i<90;i++) sparks.push({x:w/2+(Math.random()-.5)*w*.55,y:h*.45,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,r:Math.random()*4+2,color:Math.random()>.35?color:'#ffffff',life:1.2+Math.random()*.5});
      }
      addEventListener('pointermove', e => {mouse.x=e.clientX;mouse.y=e.clientY;});
      addEventListener('resize', resize); resize(); background(); reset();

      loadStoredSessions();
      const sharedCode = cleanCode(new URLSearchParams(location.search).get('code') || '');
      if (sharedCode.length === 6) {
        switchMode('online');
        const existing = sessionByCode(sharedCode);
        if (existing) {
          // Reclaim the saved seat in this tab instead of joining as a stranger.
          showLobbyNote('Welcome back — reconnecting to your game…');
          openSession(sharedCode);
          // Reconnect every other saved game too, so none stay stuck on "Connecting…".
          restoreAllSessions();
        } else {
          joinCode.value = sharedCode;
          const setupIntro = onlineSetup.querySelector('p');
          if (setupIntro) setupIntro.textContent = `Enter a guest name to join room ${sharedCode}.`;
          joinCode.closest('label').hidden = true;
          createGame.hidden = true;
          joinGame.textContent = `Join ${sharedCode}`;
          displayName.focus();
        }
      } else {
        restoreAllSessions();
      }
    })();
  </script>
</body>
</html>
