name = "starmuff-1v1-multiplayer"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://1v1.nz,https://www.1v1.nz,https://1v1-nz.pages.dev,https://*.1v1-nz.pages.dev,http://localhost:8787,http://127.0.0.1:8787"

[[durable_objects.bindings]]
name = "STARMUFF_ROOMS"
class_name = "StarMuffRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StarMuffRoom"]

[[ratelimits]]
name = "ROOM_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 12, period = 60 }
