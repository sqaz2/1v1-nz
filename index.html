<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1v1.nz — Head-to-head browser games</title>
  <meta name="description" content="1v1.nz — a collection of head-to-head browser games. Challenge the computer or a friend." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 800px at 50% 20%, #10294f 0%, #07152c 60%, #040b18 100%);
      color: #eaf1ff;
      padding: 24px;
    }
    main { text-align: center; max-width: 560px; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); letter-spacing: -0.02em; }
    h1 .vs { color: #ff5d5d; }
    p.tag { margin-top: 12px; color: #9db4d8; font-size: 1.05rem; }
    .games { margin-top: 36px; display: grid; gap: 12px; }
    a.game {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px; border-radius: 14px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: #fff; text-decoration: none; font-size: 1.15rem; font-weight: 600;
      transition: transform .12s ease, background .12s ease;
    }
    a.game:hover { background: rgba(255,255,255,0.11); transform: translateY(-2px); }
    a.game small { font-weight: 400; color: #9db4d8; }
    footer { margin-top: 40px; color: #5f7396; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>1<span class="vs">v</span>1.nz</h1>
    <p class="tag">Head-to-head browser games. You versus the machine — real opponents coming soon.</p>
    <div class="games">
      <a class="game" href="/connect-4">Connect Four <small>vs Computer &middot; 3 difficulties</small></a>
      <a class="game" href="/battleship">Battleship <small>vs Computer &middot; Online &middot; Public matches</small></a>
    </div>
    <footer>More 1v1 games on the way.</footer>
  </main>
</body>
</html>
