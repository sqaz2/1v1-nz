<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StarMuff Simon 1v1 — Memory Duel | 1v1.nz</title>
  <meta name="description" content="Play StarMuff Simon 1v1 free — fair paired memory challenges vs CPU or hotseat. Repeat equal-length sequences on 1v1.nz." />
  <link rel="canonical" href="https://1v1.nz/simon/" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="64x64" />
  <meta name="theme-color" content="#0b1020" />
  <meta property="og:title" content="StarMuff Simon 1v1 — Memory Duel | 1v1.nz" />
  <meta property="og:description" content="Competitive Simon 1v1 — equal-length memory challenges vs CPU or hotseat." />
  <meta property="og:url" content="https://1v1.nz/simon/" />
  <meta name="twitter:card" content="summary" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 600px at 50% 10%,#1a1540 0%,#0b1020 55%,#060810 100%);color:#eaf1ff;display:flex;flex-direction:column;align-items:center;padding:16px 16px 28px;-webkit-tap-highlight-color:transparent;user-select:none}
    header{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    a.back{color:#7dd3fc;text-decoration:none;font-size:.85rem;font-weight:600;border:1px solid rgba(125,211,252,.35);border-radius:8px;padding:6px 10px;background:rgba(255,255,255,.04)}
    h1{font-size:1.1rem;background:linear-gradient(135deg,#22d3ee,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
    .panel{width:100%;max-width:420px;background:rgba(255,255,255,.04);border:1px solid rgba(168,85,247,.28);border-radius:18px;padding:18px 16px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
    .modes{display:grid;gap:10px;margin-bottom:8px}
    .modes button{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid rgba(125,211,252,.25);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px}
    .modes button strong{font-size:1rem}
    .modes button span{font-size:.82rem;color:#94a3b8;font-weight:400}
    .modes button:disabled{opacity:.45;cursor:not-allowed}
    .modes button:hover:not(:disabled){background:rgba(34,211,238,.12)}
    .hud{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
    .hud .card{flex:1;background:rgba(0,0,0,.25);border-radius:12px;padding:10px;text-align:center;border:1px solid rgba(255,255,255,.08)}
    .hud .card.active{border-color:#22d3ee;box-shadow:0 0 16px rgba(34,211,238,.25)}
    .hud .name{font-size:.75rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em}
    .hud .round{font-size:1.4rem;font-weight:700;color:#fbbf24}
    .pad{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:280px;margin:0 auto 16px}
    .pad button{aspect-ratio:1;border-radius:18px;border:2px solid rgba(255,255,255,.12);cursor:pointer;transition:transform .1s,box-shadow .15s;touch-action:manipulation;color:#fff;font-size:1.2rem;font-weight:800;text-shadow:0 1px 3px #000}
    .pad button:disabled{cursor:default;opacity:.75}
    .pad button:not(:disabled):active{transform:scale(.95)}
    .c0{background:#0891b2}.c1{background:#7e22ce}.c2{background:#db2777}.c3{background:#16a34a}
    .c0.active{background:#67e8f9;box-shadow:0 0 28px rgba(103,232,249,.55);border-color:#fff}
    .c1.active{background:#c084fc;box-shadow:0 0 28px rgba(192,132,252,.55);border-color:#fff}
    .c2.active{background:#f472b6;box-shadow:0 0 28px rgba(244,114,182,.55);border-color:#fff}
    .c3.active{background:#4ade80;box-shadow:0 0 28px rgba(74,222,128,.55);border-color:#fff}
    .status{text-align:center;min-height:5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
    .status p{color:#94a3b8;font-size:.95rem}
    .status .over{color:#f87171;font-weight:600}
    .btn{appearance:none;border:none;cursor:pointer;padding:12px 22px;border-radius:12px;font-weight:600;font-size:.95rem;color:#fff;background:linear-gradient(135deg,#0891b2,#7e22ce)}
    .btn.secondary{background:#334155}
    .blurb{font-size:.85rem;color:#94a3b8;margin-bottom:12px;line-height:1.45}
    footer{margin-top:16px;color:#64748b;font-size:.75rem;text-align:center}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <header>
    <a class="back" href="https://1v1.nz/">← 1v1.nz</a>
    <h1>StarMuff Simon 1v1</h1>
    <span style="width:72px"></span>
  </header>

  <div class="panel">
    <div id="modeScreen">
      <p class="blurb"><strong>How it works:</strong> Both players face a different sequence of the same length. Pass the phone, tap Ready, then watch and repeat.</p>
      <div class="modes">
        <button type="button" data-mode="hotseat"><strong>Hotseat 1v1</strong><span>Pass the phone — P1 vs P2</span></button>
        <button type="button" data-mode="cpu"><strong>vs CPU</strong><span>You vs A.R.I.A. memory core</span></button>
        <button type="button" disabled><strong>Online</strong><span>vs friend — coming soon</span></button>
      </div>
    </div>

    <div id="gameScreen" hidden>
      <div class="hud">
        <div class="card" id="p0card"><div class="name" id="p0name">P1</div><div class="round">Rnd <span id="p0round">0</span></div></div>
        <div class="card" id="p1card"><div class="name" id="p1name">P2</div><div class="round">Rnd <span id="p1round">0</span></div></div>
      </div>
      <div class="pad" id="pad">
        <button type="button" class="c0" data-i="0" aria-label="Cyan, key 1" disabled>1</button>
        <button type="button" class="c1" data-i="1" aria-label="Purple, key 2" disabled>2</button>
        <button type="button" class="c2" data-i="2" aria-label="Magenta, key 3" disabled>3</button>
        <button type="button" class="c3" data-i="3" aria-label="Green, key 4" disabled>4</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>
  <footer>Competitive memory duel · equal-length challenges</footer>

<script>
(function(){
  const FREQS=[261.63,329.63,392,523.25];
  const buttons=[...document.querySelectorAll('#pad button')],statusEl=document.getElementById('status');
  const modeScreen=document.getElementById('modeScreen'),gameScreen=document.getElementById('gameScreen');
  let mode=null,names=['Player 1','Player 2'],sequences=[[],[]],attempts=[null,null],rounds=[0,0];
  let turn=0,level=1,playerIndex=0,phase='idle',generation=0,audioCtx=null;
  function ctx(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC()}if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
  function playTone(i,dur){const c=ctx();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(FREQS[i],c.currentTime);g.gain.setValueAtTime(.28,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+dur/1000);o.start();o.stop(c.currentTime+dur/1000)}catch(_){}}
  function playError(){const c=ctx();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.setValueAtTime(150,c.currentTime);o.frequency.exponentialRampToValueAtTime(50,c.currentTime+.45);g.gain.setValueAtTime(.28,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.45);o.start();o.stop(c.currentTime+.45)}catch(_){}}
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function invalidate(){generation++;setPads(false);buttons.forEach(b=>b.classList.remove('active'))}
  async function flash(i,dur,g=generation){if(g!==generation)return false;buttons[i].classList.add('active');playTone(i,dur);await sleep(dur);buttons[i].classList.remove('active');await sleep(90);return g===generation}
  function setPads(on){buttons.forEach(b=>b.disabled=!on)}
  function updateHud(){
    document.getElementById('p0name').textContent=names[0];document.getElementById('p1name').textContent=names[1];
    document.getElementById('p0round').textContent=rounds[0];document.getElementById('p1round').textContent=rounds[1];
    document.getElementById('p0card').classList.toggle('active',turn===0&&phase!=='over');document.getElementById('p1card').classList.toggle('active',turn===1&&phase!=='over')
  }
  function status(nodes){statusEl.replaceChildren(...nodes)}
  function line(text,cls=''){const p=document.createElement('p');p.textContent=text;if(cls)p.className=cls;return p}
  function action(label,fn,secondary=false){const b=document.createElement('button');b.type='button';b.className='btn'+(secondary?' secondary':'');b.textContent=label;b.onclick=fn;return b}
  function makeSequence(length){return Array.from({length},()=>Math.floor(Math.random()*4))}
  function buildChallenges(){sequences=[makeSequence(level),makeSequence(level)]}
  function prepareTurn(index){
    invalidate();turn=index;phase='handoff';playerIndex=0;updateHud();
    const label=mode==='hotseat'?`Pass to ${names[turn]}. They should tap Ready themselves.`:`${names[turn]} faces length ${level}.`;
    status([line(label),action(`${names[turn]} ready · length ${level}`,showSequence)])
  }
  async function showSequence(){
    invalidate();const g=generation;phase='watch';setPads(false);updateHud();status([line(`${names[turn]} — watch ${level} signal${level===1?'':'s'}…`)]);await sleep(500);if(g!==generation)return;
    for(const i of sequences[turn])if(!(await flash(i,380,g)))return;
    if(g!==generation)return;phase='input';playerIndex=0;updateHud();
    if(mode==='cpu'&&turn===1){setPads(false);status([line('A.R.I.A. is repeating its sequence…')]);runCpuInput(g);return}
    setPads(true);status([line(`${names[turn]} — repeat ${level} signal${level===1?'':'s'}.`)]);
  }
  function finishAttempt(success){
    invalidate();attempts[turn]=success;if(success){rounds[turn]++;updateHud()}
    if(attempts[0]===null||attempts[1]===null){
      const next=turn===0?1:0;status([line(success?'Perfect. Hand off the device.':`${names[turn]} missed. The other player still gets the same-length chance.`,success?'':'over'),action(`Ready for ${names[next]}`,()=>prepareTurn(next))]);return
    }
    resolvePair()
  }
  function resolvePair(){
    if(attempts[0]!==attempts[1]){endDuel(attempts[0]?0:1);return}
    if(!attempts[0]){phase='handoff';status([line(`Both players missed length ${level}. Replay this length.`,'over'),action('Replay length '+level,startPair)]);return}
    level++;phase='handoff';status([line(`Both cleared it. Next challenge: length ${level}.`),action('Start next challenge',startPair)])
  }
  function startPair(){attempts=[null,null];buildChallenges();prepareTurn(0)}
  function endDuel(winner){phase='over';setPads(false);updateHud();status([line(`${names[winner]} wins the duel!`,'over'),line(`Final challenge length: ${level}`),action('Play again',()=>beginMatch(mode)),action('Change mode',()=>{invalidate();gameScreen.hidden=true;modeScreen.hidden=false},true)])}
  function onPress(i){
    if(phase!=='input'||(mode==='cpu'&&turn===1))return;const expected=sequences[turn][playerIndex];flash(i,180);
    if(i!==expected){playError();finishAttempt(false);return}playerIndex++;if(playerIndex===sequences[turn].length)finishAttempt(true)
  }
  async function runCpuInput(g){
    await sleep(450);if(g!==generation)return;
    for(let i=0;i<sequences[1].length;i++){
      const failChance=level>=9?.15:level>=6?.08:.02;let choice=sequences[1][i];if(Math.random()<failChance)choice=(choice+1+Math.floor(Math.random()*3))%4;
      if(!(await flash(choice,200,g)))return;if(choice!==sequences[1][i]){playError();finishAttempt(false);return}await sleep(160);if(g!==generation)return
    }
    finishAttempt(true)
  }
  function beginMatch(nextMode){
    invalidate();mode=nextMode;names=mode==='cpu'?['You','A.R.I.A.']:['Player 1','Player 2'];rounds=[0,0];turn=0;level=1;attempts=[null,null];phase='idle';modeScreen.hidden=true;gameScreen.hidden=false;updateHud();
    status([line('Each player gets a different sequence of the same length.'),action('Start duel',startPair)])
  }
  document.querySelectorAll('#modeScreen [data-mode]').forEach(b=>b.onclick=()=>beginMatch(b.dataset.mode));
  buttons.forEach(b=>b.addEventListener('click',()=>onPress(+b.dataset.i)));
  window.addEventListener('keydown',e=>{if(['1','2','3','4'].includes(e.key)){e.preventDefault();onPress(Number(e.key)-1)}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&(phase==='watch'||phase==='input')){invalidate();phase='handoff'}else if(!document.hidden&&phase==='handoff'&&mode){status([line('Sequence paused while the page was hidden.'),action(`Replay ${names[turn]}'s sequence`,showSequence)])}});
})();
</script>
</body>
</html>
