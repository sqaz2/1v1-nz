<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>StarMuff Mini Golf 3D | 1v1.nz</title>
<meta name="description" content="Play 3D mini golf 1v1 online with a friend, against the CPU, or pass-and-play. Eighteen StarMuff planet holes with ramps, portals, moving gates, a jump ramp, a volcano and a working loop-the-loop."/>
<link rel="canonical" href="https://1v1.nz/minigolf/"/>
<link rel="icon" href="/assets/favicon.png" type="image/png" sizes="64x64"/>
<link rel="apple-touch-icon" href="/assets/favicon.png"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="StarMuff Mini Golf 3D | 1v1.nz"/>
<meta property="og:description" content="3D mini golf duels across StarMuff planets. Online rooms, CPU and hotseat."/>
<meta property="og:url" content="https://1v1.nz/minigolf/"/>
<meta property="og:image" content="https://1v1.nz/minigolf/assets/anchorage-card.webp"/>
<style>
html,body{margin:0;height:100%;background:#070b14;color:#eaf1ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;background:linear-gradient(#070b14cc,#070b1400)}
.hud .title{font-weight:800;letter-spacing:.02em}.hud .par{opacity:.7;font-size:.9rem}
.hud .spacer{flex:1}.hud button{pointer-events:auto}
#players{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chip{font-size:.8rem;padding:4px 9px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff22}
.chip.p0::before{content:"●";color:var(--p0,#fff);margin-right:5px}.chip.p1::before{content:"●";color:#ffc93c;margin-right:5px}
#cpuBubble{position:fixed;left:50%;transform:translate(-50%,8px);bottom:max(64px,calc(env(safe-area-inset-bottom) + 54px));max-width:min(430px,92vw);background:#0e1626f0;border:1px solid #ffc93c66;border-radius:14px;padding:9px 14px;font-size:.92rem;z-index:30;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#cpuBubble.show{opacity:1;transform:translate(-50%,0)}#cpuBubble b{color:#ffc93c;display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #ffffff33;padding:0;background:var(--c)} .sw.on{border-color:#fff;box-shadow:0 0 0 2px #38bdf8}
.chip.on{border-color:#7dd3fc;background:#38bdf833}
button{font:inherit;color:#eaf1ff;background:#ffffff14;border:1px solid #ffffff2a;border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{background:#ffffff22}button.primary{background:#38bdf8;color:#04121f;border:0;font-weight:700}
#status{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));max-width:92vw;text-align:center;font-size:.9rem;padding:7px 14px;border-radius:999px;background:#070b14b0;pointer-events:none}
.cam{position:fixed;bottom:max(56px,calc(env(safe-area-inset-bottom) + 46px));display:flex;gap:8px;right:12px}.cam button{width:46px;height:46px;border-radius:50%;font-size:1.2rem;padding:0}
#powerWrap{position:fixed;left:14px;bottom:70px;width:16px;height:38vh;border-radius:9px;background:#ffffff1c;overflow:hidden;opacity:0;transition:opacity .15s}#powerWrap.show{opacity:1}
#power{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0)*100%);background:linear-gradient(#ff4fd8,#ffc93c,#38bdf8)}
.layer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#04060dcc;padding:16px;z-index:20}.layer.show{display:flex}
.card{background:#0e1626;border:1px solid #ffffff1f;border-radius:16px;padding:20px;max-width:440px;width:100%;max-height:92vh;overflow:auto;text-align:center}
#menu .card{background:linear-gradient(#0e1626e6,#0e1626f2),url(./assets/smackzone-card.webp) center/cover}
.card h1{margin:.1em 0;font-size:2rem;background:linear-gradient(135deg,#7dd3fc,#ff4fd8,#ffc93c);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{color:#a9bcd9}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.modes button{padding:14px 8px;font-weight:700}
.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}select{font:inherit;background:#0b1220;color:#eaf1ff;border:1px solid #ffffff2a;border-radius:8px;padding:6px}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem}td,th{padding:5px;border-bottom:1px solid #ffffff14}tfoot td{font-weight:800}
#banner{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:ban 2.6s ease}#banner b{display:block;font-size:clamp(1.4rem,6vw,2.4rem)}#banner span{opacity:.8}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-40%)}15%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0}}
#room{position:fixed;right:10px;top:84px;z-index:15;max-width:min(360px,94vw)}
.back{position:fixed;left:10px;bottom:10px;font-size:.75rem;color:#7a8fb0;z-index:5}
body:not(.ready) #menu .modes button{opacity:.5;pointer-events:none}
.credit{font-size:.72rem;color:#6f82a3;margin-top:10px}
</style>
</head>
<body>
<canvas id="scene" aria-label="3D mini golf course"></canvas>
<div class="hud">
  <span class="title" id="holeName">StarMuff Mini Golf</span><span class="par" id="holePar"></span><span class="spacer"></span>
  <button id="scoreBtn" aria-label="Scorecard">📋</button><button id="muteBtn" aria-label="Mute">🔊</button><button id="menuBtn">Menu</button>
  <div id="players"></div>
</div>
<div id="powerWrap" aria-hidden="true"><div id="power"></div></div>
<div class="cam"><button id="rotL" aria-label="Rotate camera left">⟲</button><button id="rotR" aria-label="Rotate camera right">⟳</button></div>
<div id="cpuBubble" hidden><b>StarMuff CPU</b><span id="cpuText"></span></div>
<div id="status" role="status">Loading physics…</div>
<div id="banner"><b></b><span></span></div>
<div id="room" hidden></div>
<div class="layer" id="menu"><div class="card">
  <h1>StarMuff Mini Golf</h1>
  <p>3D mini golf across StarMuff planets. Drag back and release to putt. Fewest strokes wins.</p>
  <div class="modes">
    <button class="primary" data-mode="online">Online 1v1</button><button data-mode="cpu">vs CPU</button>
    <button data-mode="hotseat">Hotseat</button><button data-mode="solo">Solo practice</button>
  </div>
  <div class="opts"><label>Course <select id="courseSel"><option value="full">StarMuff Tour (18 holes)</option><option value="quick">Quick 3</option><optgroup label="Single hole">
  <option value="hole:anchorage-landing">Anchorage Landing</option><option value="hole:dockyard-dogleg">Dockyard Dogleg</option><option value="hole:ice-shelf">Ice Shelf Ramp</option><option value="hole:bumper-pit">Smackzone Bumper Pit</option><option value="hole:null-cube-gate">Null-Cube Gate</option><option value="hole:crown-of-six-stars">Crown of Six Stars</option><option value="hole:portal-panic">Portal Panic</option><option value="hole:loop-the-loop">Loop-the-Loop</option><option value="hole:twin-gates">Twin Gates</option><option value="hole:trap-jump">Trap Jump</option><option value="hole:volcano">Volcano</option><option value="hole:serpent">Serpent</option><option value="hole:gauntlet">The Gauntlet</option><option value="hole:split-decision">Split Decision</option><option value="hole:ice-bridge">Ice Bridge</option><option value="hole:ricochet">Ricochet</option><option value="hole:downhill">Downhill</option><option value="hole:grand-finale">Grand Finale</option></optgroup></select></label>
  <label>CPU <select id="levelSel"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></label></div>
  <div class="opts"><span style="font-size:.85rem;color:#a9bcd9">Your ball</span><span id="ballSwatches"></span></div>
  <p class="credit" id="bestLine"></p>
  <p class="credit">Planet art and relic models from StarMuff. Online rooms are casual and host-run: not ranked.</p>
  <p><a href="/" style="color:#7dd3fc">← All 1v1.nz games</a></p>
</div></div>
<div class="layer" id="overlay"><div class="card"><h2 id="ovTitle"></h2><p id="ovText"></p><button class="primary" id="ovBtn">OK</button></div></div>
<div class="layer" id="scorecard"><div class="card"><h2 id="scoreTitle">Scorecard</h2><p id="scoreMsg"></p><table id="scoreTable"></table>
  <div class="opts"><button class="primary" id="scoreAgain" hidden>Play again</button><button id="scoreClose">Close</button></div></div></div>
<noscript>StarMuff Mini Golf needs JavaScript and WebGL.</noscript>
<script src="/multiplayer/client.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
