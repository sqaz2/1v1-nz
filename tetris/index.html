<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>StarMuff Tetris 1v1 — vs CPU or Shared Keyboard | 1v1.nz</title>
<meta name="description" content="Play StarMuff Tetris 1v1 free — dual-board versus with garbage attacks. vs CPU or local 2-player on 1v1.nz."/>
<link rel="canonical" href="https://1v1.nz/tetris/"/>
<link rel="icon" href="/assets/favicon.png" type="image/png" sizes="64x64"/>
<meta name="theme-color" content="#04060e"/>
<meta property="og:title" content="StarMuff Tetris 1v1 | 1v1.nz"/>
<meta property="og:description" content="Dual-board Tetris 1v1 with garbage — vs CPU or local 2-player."/>
<meta property="og:url" content="https://1v1.nz/tetris/"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#04060e;color:#d8dce8;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px;overflow-x:hidden}
a.back{align-self:flex-start;color:#3ea8ff;text-decoration:none;font-size:.8rem;font-weight:600;border:1px solid rgba(62,168,255,.35);border-radius:6px;padding:4px 10px;margin-bottom:8px}
h1{font-size:clamp(1.2rem,4vw,1.6rem);letter-spacing:.08em;background:linear-gradient(135deg,#3ea8ff,#ffd84d);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.sub{color:#5a6488;font-size:.85rem;margin-bottom:14px;text-align:center;max-width:520px}
.modes{display:grid;gap:10px;width:100%;max-width:420px;margin-bottom:12px}
.modes button{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid rgba(62,168,255,.3);background:rgba(8,14,28,.92);color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.modes button strong{font-size:1rem}
.modes button span{font-size:.8rem;color:#5a6488;font-weight:400}
.modes button:disabled{opacity:.45;cursor:not-allowed}
.modes button:hover:not(:disabled){background:rgba(62,168,255,.12)}
#game{width:100%;max-width:720px}
.boards{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;align-items:flex-start}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.side h2{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#5a6488}
.side h2.active{color:#ffd84d}
.side canvas{background:rgba(8,14,28,.95);border:2px solid rgba(50,70,120,.45);border-radius:8px;image-rendering:pixelated;max-width:100%;height:auto}
.meta{font-size:.8rem;color:#9db4d8;display:flex;gap:12px}
.banner{text-align:center;margin:10px 0;min-height:1.4em;color:#ffd84d;font-weight:600}
.controls-hint{font-size:.72rem;color:#5a6488;text-align:center;margin-top:8px;line-height:1.4}
.overlay{position:fixed;inset:0;background:rgba(4,6,14,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20}
.overlay p{font-size:1.4rem;font-weight:700}
.overlay button{padding:12px 22px;border:none;border-radius:10px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#3ea8ff,#ff4d6a);color:#fff}
.overlay .ghost{background:#1b2748}
.touch{display:none;margin-top:10px;gap:8px;justify-content:center;flex-wrap:wrap;width:100%;max-width:360px}
.touch button{flex:1;min-width:64px;padding:14px;border-radius:10px;border:1px solid rgba(62,168,255,.3);background:#0c1226;color:#d8dce8;font-size:1.1rem;touch-action:manipulation}
@media(max-width:640px){.touch{display:flex}.side canvas{width:min(42vw,160px)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<a class="back" href="https://1v1.nz/">← 1v1.nz</a>
<h1>STARMUFF TETRIS 1v1</h1>
<p class="sub">Dual boards · clear lines to send garbage · top out loses</p>

<div id="modeScreen" class="modes">
  <button type="button" data-mode="cpu"><strong>vs CPU</strong><span>You (arrows/WASD) vs AI — garbage attacks</span></button>
  <button type="button" data-mode="local"><strong>Shared keyboard 2-player</strong><span>Keyboard required · P1: WASD · P2: Arrow keys</span></button>
  <button type="button" disabled><strong>Online</strong><span>vs friend — coming soon</span></button>
</div>

<div id="game" hidden>
  <div class="banner" id="banner">Get ready…</div>
  <div class="boards">
    <div class="side">
      <h2 id="l0title" class="active">You</h2>
      <canvas id="c0" width="100" height="200"></canvas>
      <div class="meta"><span>Lines <b id="l0">0</b></span><span>Sent <b id="s0">0</b></span></div>
    </div>
    <div class="side">
      <h2 id="l1title">CPU</h2>
      <canvas id="c1" width="100" height="200"></canvas>
      <div class="meta"><span>Lines <b id="l1">0</b></span><span>Sent <b id="s1">0</b></span></div>
    </div>
  </div>
  <p class="controls-hint" id="hint">←→ move · ↑/X rotate · ↓ soft · Space hard drop</p>
  <div class="touch" id="touch">
    <button type="button" data-act="left">◀</button>
    <button type="button" data-act="rot">↻</button>
    <button type="button" data-act="right">▶</button>
    <button type="button" data-act="soft">▼</button>
    <button type="button" data-act="hard">⬇</button>
  </div>
</div>

<div id="overlay" class="overlay" hidden>
  <p id="result"></p>
  <button type="button" id="again">Play again</button>
  <button type="button" class="ghost" id="chg">Change mode</button>
</div>

<script>
(function(){
const COLS=10,ROWS=20;
const SHAPES={
  I:{c:'#3ea8ff',b:[[0,1],[1,1],[2,1],[3,1]]},
  O:{c:'#ffd84d',b:[[1,0],[2,0],[1,1],[2,1]]},
  T:{c:'#c084fc',b:[[1,0],[0,1],[1,1],[2,1]]},
  S:{c:'#4dff91',b:[[1,0],[2,0],[0,1],[1,1]]},
  Z:{c:'#ff4d6a',b:[[0,0],[1,0],[1,1],[2,1]]},
  J:{c:'#6ae4ff',b:[[0,0],[0,1],[1,1],[2,1]]},
  L:{c:'#ffa94d',b:[[2,0],[0,1],[1,1],[2,1]]}
};
const TYPES=Object.keys(SHAPES);
const GARBAGE_MAP={1:0,2:1,3:2,4:4};

let mode=null, running=false, winner=null;
let players=[], raf=0, last=0;

function emptyBoard(){return Array.from({length:ROWS},()=>Array(COLS).fill(null))}
function bag(){const a=TYPES.slice();for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function mkPiece(type){const d=SHAPES[type];return{type,b:d.b.map(p=>[...p]),c:d.c,x:3,y:0}}
function hit(board,b,x,y){return b.some(([bx,by])=>{const X=x+bx,Y=y+by;return X<0||X>=COLS||Y>=ROWS||(Y>=0&&board[Y][X])})}
// normalize rotation around min
function rotateCells(cells){
  // rotate 90° CW around origin then shift to keep min at 0
  const nb=cells.map(([x,y])=>[y,-x]);
  const minX=Math.min(...nb.map(c=>c[0]));
  const minY=Math.min(...nb.map(c=>c[1]));
  return nb.map(([x,y])=>[x-minX,y-minY]);
}

function makePlayer(name, canvas, isCpu){
  return{
    name, canvas, ctx:canvas.getContext('2d'), isCpu,
    board:emptyBoard(), bag:bag(), cur:null, next:null,
    lines:0, sent:0, dropMs:700, dropAcc:0, over:false,
    pendingGarbage:0, cpuAcc:0
  };
}

function spawn(p){
  if(!p.bag.length)p.bag=bag();
  const t = p.next || p.bag.pop();
  if(!p.bag.length)p.bag=bag();
  p.next = p.bag.pop();
  p.cur=mkPiece(t);
  if(hit(p.board,p.cur.b,p.cur.x,p.cur.y)){p.over=true;endMatch(p===players[0]?1:0)}
}

function lock(p){
  const {cur,board}=p;
  if(!cur||p.over||winner!==null)return;
  let lockedAbove=false;
  cur.b.forEach(([bx,by])=>{const X=cur.x+bx,Y=cur.y+by;if(Y<0)lockedAbove=true;else if(Y<ROWS&&X>=0&&X<COLS)board[Y][X]=cur.c});
  p.cur=null;
  if(lockedAbove){p.over=true;endMatch(p===players[0]?1:0);return}
  let cleared=0;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r].every(c=>c)){board.splice(r,1);board.unshift(Array(COLS).fill(null));cleared++;r++}
  }
  p.lines+=cleared;
  const attack=GARBAGE_MAP[cleared]||0;
  const cancelled=Math.min(p.pendingGarbage,attack);
  p.pendingGarbage-=cancelled;
  const outgoing=attack-cancelled;
  if(outgoing){
    const opp=players[p===players[0]?1:0];
    opp.pendingGarbage+=outgoing;
    p.sent+=outgoing;
  }
  if(!applyGarbage(p)||p.over||winner!==null){updateMeta();return}
  spawn(p);
  updateMeta();
}

function applyGarbage(p){
  while(p.pendingGarbage>0){
    p.pendingGarbage--;
    if(p.board[0].some(Boolean)){
      p.over=true;endMatch(p===players[0]?1:0);return false;
    }
    const hole=0|Math.random()*COLS;
    const row=Array(COLS).fill('#334155');row[hole]=null;
    p.board.shift();
    p.board.push(row);
  }
  return true;
}

function move(p,dx,dy){
  if(!p.cur||p.over)return false;
  if(!hit(p.board,p.cur.b,p.cur.x+dx,p.cur.y+dy)){p.cur.x+=dx;p.cur.y+=dy;return true}
  return false;
}
function hardDrop(p){if(!p.cur||p.over)return;while(move(p,0,1));lock(p)}
function softDrop(p){if(!move(p,0,1))lock(p)}
function rotateP(p){
  if(!p.cur||p.over)return;
  const old=p.cur.b.map(c=>[...c]);
  p.cur.b=rotateCells(p.cur.b);
  if(hit(p.board,p.cur.b,p.cur.x,p.cur.y)){
    for(const k of [0,-1,1,-2,2]){
      if(!hit(p.board,p.cur.b,p.cur.x+k,p.cur.y)){p.cur.x+=k;return}
    }
    p.cur.b=old;
  }
}

function drawPlayer(p){
  const ctx=p.ctx, W=p.canvas.width, H=p.canvas.height;
  const cs=W/COLS;
  ctx.fillStyle='#080e1c';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(50,70,120,.35)';ctx.lineWidth=1;
  for(let x=1;x<COLS;x++){ctx.beginPath();ctx.moveTo(x*cs,0);ctx.lineTo(x*cs,H);ctx.stroke()}
  for(let y=1;y<ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*cs);ctx.lineTo(W,y*cs);ctx.stroke()}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(p.board[r][c]){
    ctx.fillStyle=p.board[r][c];ctx.fillRect(c*cs+1,r*cs+1,cs-2,cs-2);
  }
  if(p.cur){
    // ghost
    let gy=p.cur.y;while(!hit(p.board,p.cur.b,p.cur.x,gy+1))gy++;
    ctx.globalAlpha=.25;
    p.cur.b.forEach(([bx,by])=>{ctx.fillStyle=p.cur.c;ctx.fillRect((p.cur.x+bx)*cs+1,(gy+by)*cs+1,cs-2,cs-2)});
    ctx.globalAlpha=1;
    p.cur.b.forEach(([bx,by])=>{ctx.fillStyle=p.cur.c;ctx.fillRect((p.cur.x+bx)*cs+1,(p.cur.y+by)*cs+1,cs-2,cs-2)});
  }
}

function updateMeta(){
  document.getElementById('l0').textContent=players[0].lines;
  document.getElementById('l1').textContent=players[1].lines;
  document.getElementById('s0').textContent=players[0].sent;
  document.getElementById('s1').textContent=players[1].sent;
}

function endMatch(winnerIdx){
  if(winner!==null)return;
  winner=winnerIdx; running=false;
  cancelAnimationFrame(raf);
  document.getElementById('result').textContent=players[winnerIdx].name+' wins!';
  document.getElementById('overlay').hidden=false;
  document.getElementById('banner').textContent='Match over';
}

function cpuStep(p,dt){
  p.cpuAcc+=dt;
  const interval=Math.max(80,220-p.lines*4);
  if(p.cpuAcc<interval)return;
  p.cpuAcc=0;
  if(!p.cur)return;
  // simple AI: try rotate randomly, move toward hole/center, soft drop
  if(Math.random()<0.25)rotateP(p);
  const target=3+((0|p.cur.x)+p.lines)%4;
  if(p.cur.x<target)move(p,1,0);
  else if(p.cur.x>target)move(p,-1,0);
  if(Math.random()<0.55)softDrop(p);
  else if(Math.random()<0.08)hardDrop(p);
}

function tick(ts){
  if(!running)return;
  if(!last)last=ts;
  const dt=Math.min(50,ts-last);last=ts;
  for(const p of players){
    if(p.over)continue;
    p.dropAcc+=dt;
    const speed=Math.max(120,p.dropMs-p.lines*18);
    while(p.dropAcc>=speed){p.dropAcc-=speed;if(!move(p,0,1))lock(p)}
    if(p.isCpu)cpuStep(p,dt);
    drawPlayer(p);
  }
  raf=requestAnimationFrame(tick);
}

function resizeCanvases(){
  for(const [id,p] of [['c0',0],['c1',1]]){
    const c=document.getElementById(id);
    const side=Math.min(200, Math.floor((window.innerWidth-48)/2));
    const w=Math.max(100,side);
    c.width=w; c.height=w*2;
    if(players[p]) {players[p].canvas=c; players[p].ctx=c.getContext('2d'); drawPlayer(players[p])}
  }
}

function start(m){
  mode=m; winner=null; running=true; last=0;
  document.getElementById('modeScreen').hidden=true;
  document.getElementById('game').hidden=false;
  document.getElementById('overlay').hidden=true;
  const n0=m==='cpu'?'You':'P1 (WASD)';
  const n1=m==='cpu'?'CPU':'P2 (Arrows)';
  document.getElementById('l0title').textContent=n0;
  document.getElementById('l1title').textContent=n1;
  document.getElementById('hint').textContent=m==='local'
    ?'P1: A/D move · W rotate · S soft · Space/F hard ··· P2: Arrows · Up rotate · Down soft · Enter hard'
    :'←→ move · ↑ rotate · ↓ soft · Space hard drop · touch pads on phone';
  document.getElementById('touch').style.display=m==='cpu'?'':'none';
  resizeCanvases();
  players=[
    makePlayer(n0,document.getElementById('c0'),false),
    makePlayer(n1,document.getElementById('c1'),m==='cpu')
  ];
  spawn(players[0]); spawn(players[1]);
  updateMeta();
  document.getElementById('banner').textContent='Fight!';
  raf=requestAnimationFrame(tick);
}

document.querySelectorAll('#modeScreen [data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));
document.getElementById('again').onclick=()=>start(mode);
document.getElementById('chg').onclick=()=>{
  running=false;cancelAnimationFrame(raf);
  document.getElementById('overlay').hidden=true;
  document.getElementById('game').hidden=true;
  document.getElementById('modeScreen').hidden=false;
};

function handleKey(e,down){
  if(!running||!down)return;
  const k=e.key;
  const p0=players[0], p1=players[1];
  if(mode==='cpu'){
    if(['ArrowLeft','a','A'].includes(k)){e.preventDefault();move(p0,-1,0)}
    else if(['ArrowRight','d','D'].includes(k)){e.preventDefault();move(p0,1,0)}
    else if(['ArrowDown','s','S'].includes(k)){e.preventDefault();softDrop(p0)}
    else if(['ArrowUp','w','W','x','X'].includes(k)){e.preventDefault();rotateP(p0)}
    else if(k===' '||k==='Enter'){e.preventDefault();hardDrop(p0)}
  }else{
    if(k==='a'||k==='A'){e.preventDefault();move(p0,-1,0)}
    else if(k==='d'||k==='D'){e.preventDefault();move(p0,1,0)}
    else if(k==='s'||k==='S'){e.preventDefault();softDrop(p0)}
    else if(k==='w'||k==='W'||k==='f'||k==='F'){e.preventDefault(); if(k==='w'||k==='W')rotateP(p0); else hardDrop(p0)}
    else if(k===' '){e.preventDefault();hardDrop(p0)}
    else if(k==='ArrowLeft'){e.preventDefault();move(p1,-1,0)}
    else if(k==='ArrowRight'){e.preventDefault();move(p1,1,0)}
    else if(k==='ArrowDown'){e.preventDefault();softDrop(p1)}
    else if(k==='ArrowUp'){e.preventDefault();rotateP(p1)}
    else if(k==='Enter'){e.preventDefault();hardDrop(p1)}
  }
  drawPlayer(p0);drawPlayer(p1);
}
window.addEventListener('keydown',e=>handleKey(e,true));
document.querySelectorAll('#touch [data-act]').forEach(b=>{
  const act=()=>{
    if(!running||mode!=='cpu')return;
    const p=players[0];
    ({left:()=>move(p,-1,0),right:()=>move(p,1,0),rot:()=>rotateP(p),soft:()=>softDrop(p),hard:()=>hardDrop(p)})[b.dataset.act]();
    drawPlayer(p);
  };
  b.addEventListener('pointerdown',e=>{e.preventDefault();act()});
});
window.addEventListener('resize',resizeCanvases);
})();
</script>
</body>
</html>
